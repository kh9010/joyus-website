<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Joyus Studio — Homepage studies</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Arial,sans-serif;color:#222;background:white}.shell{display:grid;grid-template-columns:230px 1fr;height:100dvh}aside{padding:30px 22px;background:#f6f7f8;border-right:1px solid #ddd;display:flex;flex-direction:column}h1{font-size:19px;line-height:1.2;margin:0 0 8px}small{font-size:12px;color:#62666b}.history{margin-top:45px;display:grid;gap:12px}.history a{display:block;border-left:3px solid #bbb;color:#222;text-decoration:none;padding:12px;background:white;font-size:14px}.history a[aria-current]{border-left-color:#222}.history strong,.history small{display:block}.history small{margin-top:7px}iframe{width:100%;height:100%;border:0}a:focus-visible{outline:3px solid #315da8;outline-offset:3px}@media(max-width:700px){.shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.history{margin:0;grid-template-columns:1fr 1fr 1fr}h1{font-size:16px}}
.rail-toggle{font:13px Arial,sans-serif;background:#fff;border:1px solid #bbb;padding:8px 12px;cursor:pointer;min-height:36px;margin-top:auto;align-self:flex-start}.rail-show{position:fixed;left:10px;bottom:10px;z-index:9;display:none;font:13px Arial,sans-serif;background:#222;color:#fff;border:0;padding:9px 14px;cursor:pointer;min-height:36px;opacity:.85}body.full .shell{grid-template-columns:0 1fr}body.full aside{display:none}body.full .rail-show{display:block}@media(max-width:700px){body.full .shell{grid-template-rows:0 1fr}}</style></head><body><div class="shell"><aside><div><h1>Joyus Studio</h1><small>Homepage studies</small></div><nav class="history" aria-label="Iteration history"><a href="iterations/01/index.html" target="study" aria-current="page"><strong>01 / Rotating pills</strong><small>22 September 2026<br>Divya’s wireframe; “We reimagine ___”; five pills; one page per piece, 37 in rotation</small></a></nav><button type="button" class="rail-toggle" id="hide">Hide studies</button></aside><button type="button" class="rail-show" id="show">Studies</button><iframe title="Homepage study" name="study" src="iterations/01/index.html"></iframe></div>
<script>document.querySelectorAll('.history a').forEach(a=>a.addEventListener('click',()=>{document.querySelectorAll('.history a').forEach(x=>x.removeAttribute('aria-current'));a.setAttribute('aria-current','page');}));</script><script>(function(){const set=v=>{document.body.classList.toggle('full',v);try{localStorage.setItem('rail-hidden',v?'1':'')}catch(e){}};try{set(localStorage.getItem('rail-hidden')==='1')}catch(e){}document.getElementById('hide').onclick=()=>set(true);document.getElementById('show').onclick=()=>set(false);})();</script></body></html>
