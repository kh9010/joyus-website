<style>
  /* :root tokens + body baseline come from styles.css */
  body { min-height: 100vh; display: flex; flex-direction: column; }
  main#main-content { flex: 1; display: flex; flex-direction: column; }

  .dot { position: absolute; border-radius: 50%; pointer-events: none; z-index: 0; }
  .d-pink   { background: var(--pink); }
  .d-cyan   { background: var(--cyan); }
  .d-yellow { background: var(--yellow); }
  .d-ink    { background: var(--ink); }

  /* Centered, matched to coming-soon.html — the headline echoes the search,
     then we point them somewhere useful. */
  .lk {
    flex: 1;
    position: relative;
    overflow: hidden;
    padding: clamp(8rem, 18vh, 12rem) var(--x) clamp(4rem, 8vh, 6rem);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .lk-inner { max-width: 640px; position: relative; z-index: 2; width: 100%; }
  .lk .hero-eyebrow { justify-content: center; margin-bottom: 1.1rem; }
  .lk h1 {
    font-weight: 700;
    font-size: clamp(2.4rem, 7vw, 4.6rem);
    line-height: 1.0;
    letter-spacing: -0.04em;
    color: var(--ink);
    margin: 0;
    word-break: break-word;
  }
  .lk h1 em { font-style: normal; color: var(--pink); }
  .lk-kicker {
    font-family: var(--hand);
    font-size: clamp(1.35rem, 2.6vw, 1.9rem);
    color: var(--pink);
    line-height: 1.2;
    margin: 1.1rem 0 0;
  }
  /* Retry search — subtle, centered under the results. */
  .lk-search { position: relative; max-width: 440px; margin: 2.5rem auto 0; width: 100%; }
  .hero-fill { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4em; width: 100%; min-width: 0; }
  .hero-fill #intentInput {
    flex: 1 1 0; min-width: 0;
    font-family: var(--sans); font-weight: 700;
    font-size: clamp(1.5rem, 3.5vw, 2.4rem); line-height: 1.1; letter-spacing: -0.03em;
    color: var(--pink); background: transparent;
    border: 0; border-bottom: 4px solid var(--ink); outline: none;
    padding: 0 0.15em 0.1em; transition: border-color 0.25s;
  }
  .hero-fill #intentInput::placeholder { color: var(--ink-fade); font-weight: 500; opacity: 0.6; }
  .hero-fill #intentInput:focus { border-bottom-color: var(--pink); }
  .hero-fill .submit {
    font-size: clamp(1.3rem, 2vw, 1.6rem); color: var(--ink-fade);
    background: transparent; border: 0; cursor: pointer; line-height: 1;
    font-family: var(--sans); font-weight: 500; flex-shrink: 0; align-self: center;
    transition: color 0.2s, transform 0.25s;
  }
  .hero-fill .submit:hover { color: var(--pink); transform: translateX(4px); }
  #intentSuggestions {
    position: absolute; top: calc(100% + 1rem); left: 0; right: 0;
    background: rgba(255, 255, 255, 0.97); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border-radius: 14px; box-shadow: 0 12px 40px rgba(44, 53, 68, 0.10), 0 2px 6px rgba(44, 53, 68, 0.05);
    overflow: hidden; z-index: 30; opacity: 0; transform: translateY(-8px);
    pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #intentSuggestions.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .sug {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1.25rem;
    padding: 0.85rem 1.5rem 0.85rem 2.4rem; border-top: 1px solid rgba(44, 53, 68, 0.06);
    transition: background 0.15s, color 0.15s; cursor: pointer; text-decoration: none;
    color: var(--ink); position: relative;
  }
  .sug::before { content: ""; position: absolute; left: 1rem; top: 1.15rem; width: 8px; height: 8px; border-radius: 50%; background: var(--pink); transition: transform 0.2s; }
  .sug:nth-child(2)::before { background: var(--cyan); }
  .sug:nth-child(3)::before { background: var(--yellow); }
  .sug:nth-child(4)::before { background: var(--pink); opacity: 0.6; }
  .sug:nth-child(5)::before { background: var(--cyan); opacity: 0.6; }
  .sug:first-child { border-top: 0; }
  .sug:hover { background: var(--bg); color: var(--pink); }
  .sug:hover::before { transform: scale(1.4); }
  .sug-text { font-size: 0.98rem; flex: 1; }
  .sug-dest { font-family: var(--hand); font-size: 1.1rem; color: var(--ink-fade); white-space: nowrap; }
  .sug:hover .sug-dest { color: var(--pink); }
  /* Result cards — centered column. Populated from the ?n= payload. */
  .lk-near { margin: 2.25rem auto 0; width: 100%; }
  .lk-near-list {
    list-style: none; padding: 0; margin: 0 auto;
    display: grid; gap: 0.6rem;
    max-width: 36rem; width: 100%;
    text-align: left;
  }
  .lk-near-card {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.9rem 1.15rem;
    border: 1px solid var(--rule);
    border-radius: 14px;
    background: #fff;
    text-decoration: none;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  }
  .lk-near-card:hover {
    border-color: var(--pink);
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(44, 53, 68, 0.10);
  }
  .lk-near-card__text { color: var(--ink); font-weight: 500; font-size: 1.02rem; line-height: 1.3; flex: 1; }
  .lk-near-card__meta { display: inline-flex; align-items: center; gap: 0.55rem; flex-shrink: 0; }
  .lk-near-card__dest { color: var(--ink-fade); font-size: 0.82rem; white-space: nowrap; }
  .lk-near-card:hover .lk-near-card__dest { color: var(--pink); }
  .lk-near-card__soon {
    font-size: 0.64rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--pink); background: rgba(233, 30, 123, 0.1);
    padding: 0.22rem 0.55rem; border-radius: 999px; white-space: nowrap;
  }
  /* Always-present "talk to us" — the 4th option, solid. */
  .lk-talk {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.95rem 1.15rem; border-radius: 14px; text-decoration: none;
    background: var(--ink); color: #fff; border: 1px solid var(--ink);
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .lk-talk:hover { background: var(--pink); border-color: var(--pink); transform: translateY(-2px); }
  .lk-talk__text { font-weight: 600; font-size: 1.02rem; }
  .lk-talk__dest { font-family: var(--hand); font-size: 1.15rem; opacity: 0.92; }

  /* Balanced dot frame — matched to coming-soon.html. */
  .lk .l1 { width: 90px; height: 90px; top: 18%; left: 8%; opacity:1; }
  .lk .l2 { width: 54px; height: 54px; bottom: 16%; right: 10%; opacity:1; }
  .lk .l3 { width: 16px; height: 16px; top: 28%; right: 16%; }
  .lk .l4 { width: 22px; height: 22px; bottom: 24%; left: 14%; }
  @media (max-width: 600px) { .lk .l1 { width: 60px; height: 60px; } .lk .l3 { display: none; } }
</style>
</head>

<!-- Single source of truth for the top nav.
     Sync into pages by running:  node scripts/sync-chrome.js
      → path prefix to repo root (e.g. "" or "../")
     Colors use the tokens declared in styles.css :root. -->
<style>
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 1.25rem clamp(1.5rem, 4vw, 3rem);
    padding-top: max(1.25rem, env(safe-area-inset-top));
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 500;
    background: rgba(250, 247, 242, 0.88);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    font-family: var(--sans);
  }
  .nav .nav-logo { display: inline-flex; align-items: center; line-height: 1; position: relative; z-index: 510; }
  .nav .nav-logo img { height: 32px; width: auto; display: block; }
  .nav .nav-links {
    display: flex; gap: 1.75rem; align-items: center;
    list-style: none; padding: 0; margin: 0;
  }
  .nav .nav-links a {
    font-size: 0.92rem;
    color: var(--ink-soft);
    text-decoration: none;
    font-weight: 400;
    padding-bottom: 2px;
    border-bottom: 1.5px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  .nav .nav-links a:hover { color: var(--pink); }
  .nav .nav-links a.active {
    color: var(--ink);
    font-weight: 500;
    border-bottom-color: var(--pink);
  }
  .nav .nav-cta { color: var(--ink); font-weight: 500; }
  .nav .nav-cta:hover { color: var(--pink); }

  /* Hamburger button — hidden on desktop */
  .nav-toggle {
    display: none;
    width: 44px; height: 44px;
    background: transparent; border: 0; padding: 0;
    cursor: pointer; position: relative; z-index: 510;
    align-items: center; justify-content: center;
  }
  .nav-toggle span {
    display: block; width: 24px; height: 2px;
    background: var(--ink); border-radius: 2px;
    position: absolute;
    transition: transform 0.25s ease, top 0.25s ease, opacity 0.2s;
  }
  .nav-toggle span:nth-child(1) { top: 14px; }
  .nav-toggle span:nth-child(2) { top: 21px; }
  .nav-toggle span:nth-child(3) { top: 28px; }
  .nav-toggle[aria-expanded="true"] span:nth-child(1) { top: 21px; transform: rotate(45deg); }
  .nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .nav-toggle[aria-expanded="true"] span:nth-child(3) { top: 21px; transform: rotate(-45deg); }

  @media (max-width: 720px) {
    .nav {
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      background: rgba(250, 247, 242, 0.95);
    }
    .nav-toggle { display: inline-flex; }
    .nav .nav-links {
      position: fixed;
      inset: 0;
      padding: 6rem clamp(1.5rem, 4vw, 3rem) 3rem;
      padding-top: max(6rem, calc(env(safe-area-inset-top) + 5rem));
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 1.75rem;
      background: var(--white);
      border-left: 4px solid var(--ink);
      box-shadow: -16px 0 48px rgba(44, 53, 68, 0.22);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 505;
    }
    .nav .nav-links.open { transform: translateX(0); }
    .nav .nav-links a {
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--ink);
    }
    .nav .nav-links a.active { border-bottom-color: var(--pink); }
    .nav .nav-cta { font-size: 1.6rem; }
  }
</style>
<nav class="nav">
  <a class="nav-logo" href="index.html"><img src="images/logo.webp" alt="Joyus Studio" width="500" height="383" /></a>
  <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navMenu">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-links" id="navMenu">
    <a href="work/" data-nav="work">Work</a>
    <a href="services.html" data-nav="services">Services</a>
    <a href="workshops.html" data-nav="workshops">Workshops</a>
    <a href="podcast.html" data-nav="podcast">Podcast</a>
    <a href="about.html" data-nav="about">About</a>
    <a class="nav-cta" href="say-hi.html" data-nav="say-hi">Say hi</a>
  </div>
</nav>
<script>
  (function(){
    var path = window.location.pathname;
    var active = null;
    if (/\/work(\/|$)/.test(path)) active = 'work';
    else if (/services\.html/.test(path)) active = 'services';
    else if (/workshops/.test(path)) active = 'workshops';
    else if (/podcast/.test(path)) active = 'podcast';
    else if (/about\.html/.test(path)) active = 'about';
    else if (/say-hi\.html/.test(path)) active = 'say-hi';
    if (active) {
      var links = document.querySelectorAll('.nav .nav-links a[data-nav]');
      for (var i = 0; i < links.length; i++) {
        if (links[i].getAttribute('data-nav') === active) {
          links[i].classList.add('active');
        }
      }
    }
    // hamburger toggle
    var toggle = document.querySelector('.nav-toggle');
    var menu = document.querySelector('.nav .nav-links');
    if (toggle && menu) {
      var close = function() {
        menu.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
      };
      toggle.addEventListener('click', function(e) {
        e.stopPropagation();
        var open = menu.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        document.body.style.overflow = open ? 'hidden' : '';
      });
      // close on link tap
      menu.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', close);
      });
      // close on escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && menu.classList.contains('open')) close();
      });
    }
  })();
</script>

     Colors use the tokens declared in styles.css :root. -->
<style>
  .foot {
    position: relative;
    z-index: 20;
    background: var(--bg);
    padding: 1.5rem clamp(1.5rem, 4vw, 3rem) 2rem;
    padding-bottom: max(2rem, calc(env(safe-area-inset-bottom) + 1.5rem));

    margin: 0 auto;
    width: 100%;
    display: flex;
    justify-content: space-between;

    letter-spacing: 0.05em;
  }

</style>

  <a href="say-hi.html">say hi</a>
</footer>
<!--END:FOOT-->

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var q = (params.get('q') || '').trim();
      var head = document.getElementById('lk-head');
      var eyebrow = document.getElementById('lk-eyebrow');
      var kicker = document.getElementById('lk-kicker');

      // Headline echoes what they searched — "you need" → their words.
      if (q) {
        head.textContent = '“' + q + '”';
      } else {
        head.textContent = "Let's find it.";
        if (eyebrow) eyebrow.hidden = true;
      }

      var list = document.getElementById('lk-near-list');
      var nearWrap = document.getElementById('lk-near');
      var realCount = 0;

      // Near-misses handed over from the homepage (?n= = JSON [{d,u,t}]).
      var near = [];
      try { var raw = params.get('n'); if (raw) near = JSON.parse(raw); } catch (e) { near = []; }
      if (Array.isArray(near)) {
        near.forEach(function (item) {
          if (!item || !item.u || !item.d) return;
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.className = 'lk-near-card';
          a.href = item.u;
          var text = document.createElement('span');
          text.className = 'lk-near-card__text';
          text.textContent = item.d;
          a.appendChild(text);
          var meta = document.createElement('span');
          meta.className = 'lk-near-card__meta';
          // Only unpublished case studies (→ coming-soon.html) carry the tag.
          if (item.u === 'coming-soon.html') {
            var soon = document.createElement('span');
            soon.className = 'lk-near-card__soon';
            soon.textContent = 'coming soon';
            meta.appendChild(soon);
          }
          if (item.t) {
            var dest = document.createElement('span');
            dest.className = 'lk-near-card__dest';
            dest.textContent = '→ ' + item.t;
            meta.appendChild(dest);
          }
          if (meta.children.length) a.appendChild(meta);
          li.appendChild(a);
          list.appendChild(li);
          realCount++;
        });
      }

      // Always offer "talk to us" as the final option.
      var talkLi = document.createElement('li');
      var talk = document.createElement('a');
      talk.className = 'lk-talk';
      talk.href = 'say-hi.html';
      var tt = document.createElement('span');
      tt.className = 'lk-talk__text';
      tt.textContent = 'Talk to us';
      var td = document.createElement('span');
      td.className = 'lk-talk__dest';
      td.textContent = 'we read everything →';
      talk.appendChild(tt); talk.appendChild(td);
      talkLi.appendChild(talk);
      list.appendChild(talkLi);

      nearWrap.hidden = false;

      // Kicker copy depends on whether we actually found near-misses.
      if (kicker) {
        kicker.textContent = realCount
          ? 'we think these might be interesting'
          : "we haven't made exactly that — but tell us about it";
      }
    })();
  </script>
