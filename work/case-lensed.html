<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Case study — through your lens · Joyus Studio</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css">
<style>
  :root {
    --bg: #FAF7F2;
    --paper: #ffffff;
    --ink: #2C3544;
    --ink-soft: #54606F;
    --ink-fade: #8892A0;
    --rule: rgba(44, 53, 68, 0.12);
    --pink: #E91E7B;
    --cyan: #4FC4CF;
    --yellow: #F2C94A;
    --orange: #E8734A;
    --green: #5BBD72;
    --sans: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    --hand: 'Caveat', cursive;
    --x: clamp(1.5rem, 4vw, 3rem);
    --accent: var(--pink);
    --accent-soft: rgba(233, 30, 123, 0.12);
    --accent-deep: #9a1453;
    --accent-on: #fff;
  }
  body[data-lens="brand"]    { --accent: var(--pink);   --accent-soft: rgba(233, 30, 123, 0.12); --accent-deep: #9a1453; --accent-on: #fff; }
  body[data-lens="product"]  { --accent: var(--cyan);   --accent-soft: rgba(79, 196, 207, 0.18); --accent-deep: #2d8b93; --accent-on: var(--ink); }
  body[data-lens="research"] { --accent: #c79a2a;       --accent-soft: rgba(199, 154, 42, 0.16); --accent-deep: #8a6912; --accent-on: #fff; }
  body[data-lens="story"]    { --accent: var(--orange); --accent-soft: rgba(232, 115, 74, 0.14); --accent-deep: #b04e2b; --accent-on: #fff; }
  body[data-lens="growth"]   { --accent: var(--green);  --accent-soft: rgba(91, 189, 114, 0.14); --accent-deep: #347a44; --accent-on: var(--ink); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; transition: color 0.2s; }
  img { max-width: 100%; display: block; }

  .proto-tag {
    position: fixed;
    top: 1.25rem; right: 1.25rem;
    z-index: 600;
    font-family: var(--hand);
    font-size: 1.05rem;
    color: var(--accent);
    background: var(--paper);
    border: 1.5px solid var(--accent);
    border-radius: 999px;
    padding: 0.3rem 0.85rem;
    transform: rotate(2deg);
  }

  /* HERO */
  .hero {
    position: relative;
    padding: clamp(6rem, 13vh, 9rem) var(--x) clamp(3rem, 6vh, 5rem);
    overflow: hidden;
    background: linear-gradient(180deg, var(--accent-soft) 0%, var(--bg) 100%);
  }
  .hero-inner {
    max-width: 980px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }
  .breadcrumb {
    display: inline-flex;
    gap: 0.4rem;
    align-items: center;
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-bottom: 1.75rem;
  }
  .breadcrumb a { color: var(--accent); border-bottom: 1px solid currentColor; padding-bottom: 1px; }
  .breadcrumb a:hover { color: var(--ink); }
  .breadcrumb .sep { opacity: 0.4; }

  .lens-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-on);
    background: var(--accent);
    padding: 0.4rem 0.85rem;
    border-radius: 999px;
    margin-bottom: 1.5rem;
  }
  .lens-chip::before {
    content: ""; width: 8px; height: 8px;
    border-radius: 50%; background: currentColor;
    opacity: 0.6;
  }

  .case-name-tiny {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 0.5rem;
  }
  h1.lens-headline {
    font-weight: 700;
    font-size: clamp(2.4rem, 6.4vw, 5.4rem);
    line-height: 1;
    letter-spacing: -0.035em;
    color: var(--ink);
    margin-bottom: 1.5rem;
    max-width: 18ch;
  }
  h1.lens-headline em {
    font-style: italic;
    color: var(--accent);
  }
  .lens-deck {
    font-size: clamp(1.1rem, 1.6vw, 1.35rem);
    color: var(--ink);
    max-width: 38rem;
    line-height: 1.45;
    margin-bottom: 2rem;
  }
  .annot {
    font-family: var(--hand);
    font-weight: 600;
    font-size: 1.5rem;
    color: var(--accent);
    transform: rotate(-2deg);
    display: inline-block;
    margin-bottom: 0.5rem;
  }

  /* HERO COVER */
  .hero-cover {
    margin: 2.5rem auto 0;
    max-width: 980px;
    aspect-ratio: 16/9;
    border-radius: 18px;
    overflow: hidden;
    background: var(--paper);
    box-shadow:
      0 30px 50px -24px rgba(44, 53, 68, 0.20),
      0 6px 14px -4px rgba(44, 53, 68, 0.06);
    position: relative;
    z-index: 2;
  }
  .hero-cover img { width: 100%; height: 100%; object-fit: cover; }

  /* BODY */
  .body {
    max-width: 720px;
    margin: 4rem auto;
    padding: 0 var(--x);
  }
  .body p { margin-bottom: 1.25rem; font-size: 1.08rem; color: var(--ink); }
  .body p strong { color: var(--ink); font-weight: 600; }
  .pull {
    border-left: 4px solid var(--accent);
    padding: 0.5rem 0 0.5rem 1.5rem;
    margin: 2.5rem 0;
    font-size: clamp(1.3rem, 2.4vw, 1.7rem);
    line-height: 1.3;
    font-weight: 500;
    color: var(--ink);
    font-style: italic;
  }
  .pull::before {
    content: "“";
    font-family: serif;
    font-size: 3rem;
    line-height: 0;
    color: var(--accent);
    margin-right: 0.2rem;
    vertical-align: -0.4em;
  }
  .what-mattered {
    background: var(--accent-soft);
    border-radius: 14px;
    padding: 1.5rem 1.75rem;
    margin: 2rem 0 2.5rem;
  }
  .what-mattered h3 {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-deep);
    margin-bottom: 0.85rem;
  }
  .what-mattered ul { list-style: none; padding: 0; margin: 0; }
  .what-mattered li {
    padding: 0.6rem 0;
    border-bottom: 1px solid rgba(44, 53, 68, 0.08);
    font-size: 1rem;
    color: var(--ink);
  }
  .what-mattered li:last-child { border-bottom: 0; padding-bottom: 0; }
  .what-mattered li::before {
    content: "→ ";
    color: var(--accent);
    font-weight: 600;
    margin-right: 0.4rem;
  }

  /* CTA STRIP */
  .cta-strip {
    max-width: 980px;
    margin: 0 auto 5rem;
    padding: 0 var(--x);
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.95rem 1.7rem;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 600;
    transition: transform 0.25s, box-shadow 0.25s;
  }
  .cta-primary {
    background: var(--accent);
    color: var(--accent-on);
    box-shadow: 0 6px 0 var(--accent-deep);
  }
  .cta-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--accent-deep); }
  .cta-ghost {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid rgba(44, 53, 68, 0.3);
  }
  .cta-ghost:hover { border-color: var(--ink); }
  .cta-aside {
    margin-left: auto;
    font-size: 0.92rem;
    color: var(--ink-soft);
  }
  .cta-aside a { color: var(--accent); border-bottom: 1px solid currentColor; padding-bottom: 1px; }

  /* ============ VISUAL BLOCKS — for projects with figma/asset visuals ============ */
  .visual-section {
    margin: 4rem auto;
  }
  .visual-section.full {
    max-width: 1400px;
    padding: 0 var(--x);
  }
  .visual-section.body-width {
    max-width: 980px;
    padding: 0 var(--x);
  }
  .visual-figure {
    margin: 0;
    position: relative;
  }
  .visual-figure img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 14px;
    background: var(--paper);
    box-shadow:
      0 22px 40px -22px rgba(44, 53, 68, 0.18),
      0 4px 10px -4px rgba(44, 53, 68, 0.06);
  }
  .visual-figure figcaption {
    margin-top: 0.85rem;
    font-size: 0.92rem;
    color: var(--ink-soft);
    line-height: 1.45;
    max-width: 60ch;
  }
  .visual-figure figcaption .annot-inline {
    font-family: var(--hand);
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--accent);
    margin-right: 0.5rem;
  }
  /* hero — full-bleed dramatic */
  .visual-hero img {
    aspect-ratio: 16/9;
    object-fit: cover;
    object-position: center top;
  }
  /* feature — large landscape, aspect respected */
  .visual-feature img {
    object-fit: contain;
    background: var(--paper);
  }
  /* pair — 2-up grid */
  .visual-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
  }
  .visual-pair .visual-figure img {
    aspect-ratio: 4/3;
    object-fit: cover;
    object-position: center top;
  }
  /* gallery — horizontal scroll strip of artifacts */
  .visual-gallery {
    display: flex;
    gap: 1rem;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 0.5rem var(--x) 1.5rem;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .visual-gallery .visual-figure {
    flex: 0 0 320px;
    scroll-snap-align: start;
  }
  .visual-gallery .visual-figure img {
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
  }
  /* big stat — visual anchor */
  .visual-stat {
    text-align: center;
    padding: 2rem 0;
  }
  .visual-stat .num {
    font-weight: 700;
    font-size: clamp(5rem, 14vw, 11rem);
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: var(--accent);
    display: block;
  }
  .visual-stat .label {
    font-size: 1rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 600;
    margin-top: 0.5rem;
  }
  /* zoom-on-click for visuals — turns large process artifacts into modal viewers */
  .visual-figure.zoomable img { cursor: zoom-in; transition: transform 200ms ease; }
  .visual-figure.zoomable img:hover { transform: scale(1.005); }
  .zoom-modal {
    position: fixed; inset: 0; z-index: 700;
    background: rgba(20, 22, 28, 0.92);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center; justify-content: center;
    padding: 2rem;
    cursor: zoom-out;
  }
  .zoom-modal.open { display: flex; }
  .zoom-modal img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
  }
  .zoom-modal-close {
    position: absolute;
    top: 1rem; right: 1rem;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 0;
    color: #fff;
    font-size: 1.5rem;
    cursor: pointer;
  }
  .zoom-modal-close:hover { background: rgba(255,255,255,0.25); }

  @media (max-width: 720px) {
    .visual-pair { grid-template-columns: 1fr; }
    .visual-gallery .visual-figure { flex-basis: 240px; }
    .visual-gallery .visual-figure img { height: 160px; }
  }

  /* ============ HYPOTHESIS STACK — interactive cards built from the team's real hypothesis doc ============ */
  .hyp-section { max-width: 1280px; margin: 4rem auto; padding: 0 var(--x); }
  .hyp-section-head {
    display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .hyp-section-eyebrow {
    font-family: var(--hand);
    font-size: 1.4rem;
    color: var(--accent);
    transform: rotate(-1.5deg);
    display: inline-block;
  }
  .hyp-section-title {
    font-size: clamp(1.4rem, 2.4vw, 2rem);
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.02em;
    line-height: 1.15;
    flex: 1 1 auto;
    min-width: 0;
  }
  .hyp-meta {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-fade);
  }

  .hyp-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
  }
  @media (max-width: 720px) { .hyp-grid { grid-template-columns: 1fr; } }

  .hyp-card {
    background: var(--paper);
    border: 1.5px solid var(--rule);
    border-radius: 14px;
    padding: 1.5rem 1.5rem 1.25rem;
    cursor: pointer;
    position: relative;
    transition: border-color 200ms ease, box-shadow 200ms ease, transform 200ms ease;
    text-align: left;
    width: 100%;
    font-family: var(--sans);
    color: var(--ink);
  }
  .hyp-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 16px 28px -16px rgba(44,53,68,0.18); }
  .hyp-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .hyp-card[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }

  .hyp-num {
    font-family: var(--hand);
    font-weight: 700;
    font-size: 3rem;
    line-height: 0.85;
    color: var(--accent);
    transform: rotate(-3deg);
    display: inline-block;
    margin-bottom: 0.25rem;
  }
  .hyp-title {
    font-weight: 700;
    font-size: 1.2rem;
    line-height: 1.2;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin-bottom: 0.5rem;
  }
  .hyp-belief {
    font-size: 0.98rem;
    line-height: 1.45;
    color: var(--ink);
  }
  .hyp-prompt {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-deep);
    margin-top: 1rem;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .hyp-prompt::after {
    content: "↓";
    transition: transform 200ms ease;
  }
  .hyp-card[aria-expanded="true"] .hyp-prompt::after { transform: rotate(180deg); }
  .hyp-test {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px dashed rgba(44, 53, 68, 0.18);
    display: none;
  }
  .hyp-card[aria-expanded="true"] .hyp-test { display: block; }
  .hyp-test-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-deep);
    margin-bottom: 0.5rem;
  }
  .hyp-test ul { list-style: none; padding: 0; margin: 0; }
  .hyp-test li {
    padding: 0.4rem 0;
    font-size: 0.92rem;
    line-height: 1.45;
    color: var(--ink);
  }
  .hyp-test li::before {
    content: "→ ";
    color: var(--accent);
    font-weight: 600;
  }
  .hyp-reflection {
    margin-top: 0.85rem;
    padding-top: 0.85rem;
    border-top: 1px dashed rgba(44, 53, 68, 0.18);
    font-style: italic;
    font-size: 0.92rem;
    color: var(--ink-soft);
  }
  .hyp-reflection::before {
    content: "Joyus · ";
    font-style: normal;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--accent);
    font-size: 0.72rem;
    text-transform: uppercase;
    margin-right: 0.4rem;
  }

  /* ============ NAMING WALL — drifting candidate names with the chosen one framed ============ */
  .naming-wall {
    max-width: 1280px;
    margin: 4rem auto;
    padding: 3rem var(--x);
    background: var(--paper);
    border-radius: 18px;
    position: relative;
    overflow: hidden;
  }
  .naming-wall::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, var(--accent-soft) 0%, transparent 60%);
    z-index: 0;
  }
  .naming-grid {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.6rem;
    align-items: center;
    min-height: 280px;
  }
  .naming-chip {
    font-family: var(--sans);
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--ink-soft);
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 0.55rem 0.95rem;
    transform: rotate(var(--rot, 0deg));
    transition: opacity 600ms ease, transform 400ms ease, color 400ms ease;
    opacity: 0;
    animation: namingFade 800ms ease-out forwards;
    animation-delay: var(--delay, 0ms);
  }
  @keyframes namingFade { from { opacity: 0; transform: rotate(var(--rot, 0deg)) translateY(8px); } to { opacity: 0.7; transform: rotate(var(--rot, 0deg)); } }

  .naming-chip.chosen {
    font-family: var(--sans);
    font-weight: 700;
    font-size: clamp(2rem, 4vw, 3rem);
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
    padding: 0.7rem 1.5rem;
    transform: rotate(0deg);
    box-shadow: 0 14px 28px -10px var(--accent-deep);
    opacity: 1;
    animation: namingChosen 1200ms cubic-bezier(0.2, 0.8, 0.2, 1) 1.6s both;
    order: -1;
    width: 100%;
    text-align: center;
    border-radius: 14px;
    flex-basis: auto;
    max-width: max-content;
    margin: 0 auto 1rem;
  }
  body[data-lens="product"] .naming-chip.chosen,
  body[data-lens="growth"] .naming-chip.chosen { color: var(--ink); }
  @keyframes namingChosen {
    0%   { opacity: 0; transform: scale(0.6); }
    60%  { opacity: 1; transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1); }
  }
  .naming-caption {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.92rem;
    color: var(--ink-soft);
    position: relative;
    z-index: 1;
  }
  .naming-caption strong { color: var(--ink); font-weight: 600; }

  .naming-taglines {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    position: relative;
    z-index: 1;
  }
  .naming-taglines-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-fade);
    margin-bottom: 0.85rem;
  }
  .tagline-cycle {
    position: relative;
    min-height: 4.5em;
    font-size: 1.05rem;
    line-height: 1.45;
    color: var(--ink-soft);
  }
  .tagline-cycle .t {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 700ms ease;
    font-style: italic;
  }
  .tagline-cycle .t.is-active { opacity: 1; position: relative; }
  .tagline-final-mark {
    display: inline-block;
    margin-left: 0.4rem;
    padding: 0.1rem 0.45rem;
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    vertical-align: middle;
    font-style: normal;
  }
  body[data-lens="product"] .tagline-final-mark,
  body[data-lens="growth"]  .tagline-final-mark { color: var(--ink); }

  /* ============ JOURNEY STACK — 3 expanding columns of user-voice quotes ============ */
  .journey-stack {
    max-width: 1280px;
    margin: 4rem auto;
    padding: 0 var(--x);
  }
  .journey-cols {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    align-items: stretch;
  }
  @media (max-width: 720px) { .journey-cols { grid-template-columns: 1fr; } }

  .journey-col {
    background: var(--paper);
    border: 1.5px solid var(--rule);
    border-radius: 14px;
    padding: 1.5rem;
    cursor: pointer;
    transition: border-color 200ms, transform 200ms, background 200ms;
    text-align: left;
    width: 100%;
    font-family: var(--sans);
    color: var(--ink);
    position: relative;
  }
  .journey-col:hover { border-color: var(--accent); transform: translateY(-2px); }
  .journey-col[aria-expanded="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .journey-col-num {
    font-family: var(--hand);
    font-size: 1.5rem;
    color: var(--accent);
    margin-bottom: 0.25rem;
  }
  .journey-col-name {
    font-weight: 700;
    font-size: 1.25rem;
    letter-spacing: -0.015em;
    margin-bottom: 0.4rem;
  }
  .journey-col-question {
    font-size: 0.92rem;
    color: var(--ink-soft);
    font-style: italic;

  .annotated-section { max-width: 1280px; margin: 4rem auto; padding: 0 var(--x); position: relative; }

    position: relative;
    border-radius: 14px;

  .hotspot {
    position: absolute;

    color: #fff;
    border: 3px solid #fff;
    box-shadow: 0 4px 14px var(--accent-deep);

    display: block;

    text-transform: uppercase;

    color: var(--ink-soft);

  .switch-lens-buttons .lens.current {

  }
  .switch-lens-buttons .lens.unavailable {
    opacity: 0.35; cursor: not-allowed;
    text-decoration: line-through;
  }

  /* error / fallback states */

    max-width: 720px;
    margin: 8rem auto;
    padding: 0 var(--x);

<script>
  (function(){
    var path = window.location.pathname;
    var active = null;
    if (/\/work(\/|$)/.test(path)) active = 'work';
    else if (/services\.html/.test(path)) active = 'services';
    else if (/workshops/.test(path)) active = 'workshops';
    else if (/podcast/.test(path)) active = 'podcast';
    else if (/about\.html/.test(path)) active = 'about';
    else if (/say-hi\.html/.test(path)) active = 'say-hi';
    if (active) {
      var links = document.querySelectorAll('.nav .nav-links a[data-nav]');
      for (var i = 0; i < links.length; i++) {
        if (links[i].getAttribute('data-nav') === active) {
          links[i].classList.add('active');
        }
      }
    }
    // hamburger toggle
    var toggle = document.querySelector('.nav-toggle');
    var menu = document.querySelector('.nav .nav-links');
    if (toggle && menu) {
      var close = function() {
        menu.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
      };
      toggle.addEventListener('click', function(e) {
        e.stopPropagation();
        var open = menu.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        document.body.style.overflow = open ? 'hidden' : '';
      });
      // close on link tap
      menu.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', close);
      });
      // close on escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && menu.classList.contains('open')) close();
      });
    }
  })();
</script>

                    { type: 'pair', items: [
                      { src: '../images/work/agemo/lens-product/landing-page.png',
                        annot: 'the public face', caption: 'Landing page after iteration ten. Every word tested against "would an engineer trust this?"' },
                      { src: '../images/work/agemo/lens-product/run-function-page.png',
                        annot: 'using what was built', caption: 'A generated function, running. Inputs, outputs, logs — the whole runtime made legible.' }

    } },
  'xtdb':          { name: 'XTDB',          cover: '../images/work-covers/xtdb.jpg',          href: 'xtdb.html',
    deep: { what_mattered_intro: 'A temporal database that needed to feel inevitable to engineers — without resorting to engineering-marketing clichés.' },
    lenses: {
      brand: { headline: 'An identity for <em>time-shaped data</em>.',
               deck: 'How to make a temporal database feel inevitable — to engineers who normally distrust marketing. The brand had to be technical without being cold, opinionated without being loud.',
               pull: 'Technical without being cold. Opinionated without being loud.',
               mattered: ['Type system designed to feel like a well-written README', 'Color that earns engineer trust (and does not say "synergy")', 'Brand guidelines short enough to actually be followed'] }
    } },
  'gliitch':       { name: 'Gliitch',       cover: '../images/work-covers/gliitch.jpg',       href: 'gliitch.html',
    deep: { what_mattered_intro: 'Hong Kong restaurant tech with attitude — and the brand had to keep up without becoming noise.' },
    lenses: {
      brand:  { headline: 'Loud personality, <em>tight system</em>.',
                deck: 'Brand identity for a Hong Kong restaurant tech provider with attitude — kept legible across menus, dashboards, and merch. Personality that scales is rare. This one had to.',
                pull: 'Personality that scales is rare. This one had to.',
                mattered: ['A wordmark that holds across signage and a 16px UI label', 'Voice rules tight enough to onboard a new copywriter in a day', 'Color discipline that lets the personality actually land'] },
      growth: { headline: 'A brand that doubles as a <em>sales asset</em>.',
                deck: 'When the moodboard is also the pitch deck — and the pitch deck closes the room. The brand had to be a closer, not a deliverable.',
                pull: 'The brand had to be a closer, not a deliverable.',
                mattered: ['Brand assets shipped as sales tools, not after-the-fact marketing', 'A pitch deck system the founders could actually edit themselves', 'Visuals that survive being screen-shared in low-light meetings'] }
    } },
  'secret-senses': { name: 'Secret Senses', cover: '../images/work-covers/secret-senses.jpg', href: 'secret-senses.html',
    deep: { what_mattered_intro: 'A hair-care brand whose ethos lived in the packaging — and so the packaging had to do the talking.' },
    lenses: {
      brand: { headline: 'A hair-care ethos in <em>packaging form</em>.',
               deck: 'Identity, illustration, and packaging — all telling the same quiet story about how a brand wants to be picked up. The shelf is the only marketing channel that matters.',
               pull: 'The shelf is the only marketing channel that matters.',
               mattered: ['Illustration system that scales from 1-inch icon to full label', 'Packaging hierarchy that survives the 6-second shelf scan', 'A back-of-pack story worth reading in line at checkout'] }

const LENS_NAME = {
  brand: 'Brand & Identity',
  product: 'Product & Interface',
  research: 'Research & Strategy',
  story: 'Story & Pitch',
  growth: 'Growth & Distribution'
};

const params = new URLSearchParams(location.search);
const projectKey = params.get('project');
const lensKey    = params.get('lens');

const project = PROJECTS[projectKey];
const lens    = project && project.lenses[lensKey] ? lensKey : null;

const out = document.getElementById('content');

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

if (!project) {
  out.innerHTML = `
    <div class="blank-state">
      <h2>No project picked.</h2>
      <p>This page expects a <code>?project=</code> URL parameter. Try one of these:</p>
      <p>
        ${Object.keys(PROJECTS).map(k => `<a class="cta cta-ghost" style="margin:.25rem;" href="?project=${k}&lens=${Object.keys(PROJECTS[k].lenses)[0]}">${escapeHtml(PROJECTS[k].name)}</a>`).join('')}
      </p>
    </div>`;
} else if (!lens) {
  // Project exists but lens isn't valid for it — let user pick.
  document.body.dataset.lens = Object.keys(project.lenses)[0];
  out.innerHTML = `
    <div class="blank-state">
      <h2>${escapeHtml(project.name)} isn’t framed through that lens.</h2>
      <p>Pick a lens that applies, or open the case study on its own terms:</p>
      <p>
        ${Object.keys(project.lenses).map(l => `<a class="cta cta-primary" style="margin:.25rem;" href="?project=${projectKey}&lens=${l}">${escapeHtml(LENS_NAME[l])}</a>`).join('')}
        <br/><br/>
        <a class="cta cta-ghost" href="${project.href}">open as-is →</a>
      </p>
    </div>`;
} else {
  document.body.dataset.lens = lens;
  const lensView = project.lenses[lens];
  document.title = `${project.name} through ${LENS_NAME[lens]} · Joyus Studio`;

  const switchHtml = Object.keys(LENS_NAME).map(l => {
    const has = !!project.lenses[l];
    const cls = (l === lens) ? 'lens current' : (has ? 'lens' : 'lens unavailable');
    if (l === lens || !has) {
      return `<span class="${cls}" aria-current="${l === lens ? 'true' : 'false'}">${escapeHtml(LENS_NAME[l])}</span>`;
    }
    return `<a class="${cls}" href="?project=${projectKey}&lens=${l}">${escapeHtml(LENS_NAME[l])}</a>`;
  }).join('');

  // ============ visual block rendering ============
  function renderVisual(v) {
    if (v.type === 'stat') {
      return `<section class="visual-section body-width visual-stat">
        <span class="num">${escapeHtml(v.num)}</span>
        <span class="label">${escapeHtml(v.label)}</span>
      </section>`;
    }
    if (v.type === 'hero') {
      return `<section class="visual-section full">
        <figure class="visual-figure visual-hero zoomable">
          <img src="${v.src}" alt="${escapeHtml(v.caption || '')}" data-zoom="${v.src}" />
          <figcaption><span class="annot-inline">${escapeHtml(v.annot || '')}</span>${escapeHtml(v.caption || '')}</figcaption>
        </figure>
      </section>`;
    }
    if (v.type === 'feature') {
      return `<section class="visual-section full">
        <figure class="visual-figure visual-feature zoomable">
          <img src="${v.src}" alt="${escapeHtml(v.caption || '')}" data-zoom="${v.src}" />
          <figcaption><span class="annot-inline">${escapeHtml(v.annot || '')}</span>${escapeHtml(v.caption || '')}</figcaption>
        </figure>
      </section>`;
    }
    if (v.type === 'pair') {
      return `<section class="visual-section full">
        <div class="visual-pair">
          ${v.items.map(it => `
            <figure class="visual-figure zoomable">
              <img src="${it.src}" alt="${escapeHtml(it.caption || '')}" data-zoom="${it.src}" />
              <figcaption><span class="annot-inline">${escapeHtml(it.annot || '')}</span>${escapeHtml(it.caption || '')}</figcaption>
            </figure>`).join('')}
        </div>
      </section>`;
    }
    if (v.type === 'gallery') {
      return `<section class="visual-section">
        <div class="visual-gallery">
          ${v.items.map(it => `
            <figure class="visual-figure zoomable">
              <img src="${it.src}" alt="${escapeHtml(it.caption || '')}" data-zoom="${it.src}" />
              <figcaption>${escapeHtml(it.caption || '')}</figcaption>
            </figure>`).join('')}
        </div>
      </section>`;
    }
    if (v.type === 'hypothesis-stack') {
      return `<section class="visual-section hyp-section">
        <header class="hyp-section-head">
          <span class="hyp-section-eyebrow">${escapeHtml(v.eyebrow || '')}</span>
          <h2 class="hyp-section-title">${escapeHtml(v.title || '')}</h2>
          ${v.meta ? `<span class="hyp-meta">${escapeHtml(v.meta)}</span>` : ''}
        </header>
        <div class="hyp-grid" role="list">
          ${v.items.map((h, i) => `
            <button type="button" class="hyp-card" role="listitem" aria-expanded="false" data-hyp="${i}">
              <span class="hyp-num">H${h.num}</span>
              <h3 class="hyp-title">${escapeHtml(h.title)}</h3>
              <p class="hyp-belief">${escapeHtml(h.belief)}</p>
              <span class="hyp-prompt">how would we know we were wrong</span>
              <div class="hyp-test">
                <div class="hyp-test-label">Test criteria, in their words</div>
                <ul>${h.test.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>
                ${h.reflection ? `<p class="hyp-reflection">${escapeHtml(h.reflection)}</p>` : ''}
              </div>
            </button>`).join('')}
        </div>
      </section>`;
    }
    if (v.type === 'naming-wall') {
      // Random-but-deterministic rotations / delays based on index — keeps it lively without re-jumping on re-render.
      const seed = (i) => ((Math.sin((i + 1) * 13.37) + 1) * 0.5);
      const chips = v.candidates.map((c, i) => {
        const rot = (seed(i) * 8 - 4).toFixed(1);
        const delay = Math.floor(seed(i + 7) * 1400);
        return `<span class="naming-chip" style="--rot:${rot}deg; --delay:${delay}ms;">${escapeHtml(c)}</span>`;
      }).join('');
      const taglineHtml = (v.taglines || []).map((t, i, a) => {
        const isLast = (i === a.length - 1);
        return `<span class="t" data-i="${i}">${escapeHtml(t)}${isLast && v.taglineFinal ? ` <span class="tagline-final-mark">final pick</span>` : ''}</span>`;
      }).join('');
      const finalLine = v.taglineFinal ? `<span class="t" data-i="final"><strong style="color:var(--ink);font-style:normal;">${escapeHtml(v.taglineFinal)}</strong> <span class="tagline-final-mark">final pick</span></span>` : '';
      return `<section class="visual-section">
        <div class="naming-wall">
          <header class="hyp-section-head" style="margin-bottom:2rem;">
            <span class="hyp-section-eyebrow">${escapeHtml(v.eyebrow || '')}</span>
            <h2 class="hyp-section-title">${escapeHtml(v.title || '')}</h2>
          </header>
          <div class="naming-grid">
            <span class="naming-chip chosen">${escapeHtml(v.chosen)}</span>
            ${chips}
          </div>
          <p class="naming-caption">${v.caption || ''}</p>
          ${(v.taglines && v.taglines.length) ? `
            <div class="naming-taglines" data-tagline-cycle>
              <div class="naming-taglines-label">Tagline drafts, cycling →</div>
              <div class="tagline-cycle">${taglineHtml}${finalLine}</div>
            </div>` : ''}
        </div>
      </section>`;
    }
    if (v.type === 'journey-stack') {
      return `<section class="visual-section journey-stack">
        <header class="hyp-section-head">
          <span class="hyp-section-eyebrow">${escapeHtml(v.eyebrow || '')}</span>
          <h2 class="hyp-section-title">${escapeHtml(v.title || '')}</h2>
          ${v.meta ? `<span class="hyp-meta">${escapeHtml(v.meta)}</span>` : ''}
        </header>
        <div class="journey-cols">
          ${v.stages.map((s, i) => `
            <button type="button" class="journey-col" aria-expanded="false" data-stage="${i}">
              <span class="journey-col-num">stage ${i + 1}</span>
              <h3 class="journey-col-name">${escapeHtml(s.name)}</h3>
              <p class="journey-col-question">${escapeHtml(s.intent)} — <em>${escapeHtml(s.question)}</em></p>
              <span class="journey-col-prompt">${s.quotes.length} user quotes</span>
              <div class="journey-quotes">
                ${s.quotes.map(q => `<p class="journey-quote">${escapeHtml(q)}</p>`).join('')}
              </div>
            </button>`).join('')}
        </div>
      </section>`;
    }
    if (v.type === 'annotated') {
      const hot = (v.hotspots || []).map((h, i) => `
        <button type="button" class="hotspot" style="left:${h.x}%; top:${h.y}%;" aria-label="${escapeHtml(h.label)}" data-spot="${i}">${h.num || (i+1)}</button>
        <div class="hotspot-tip" data-tip="${i}" style="left:${h.x}%; top:${h.y}%;">
          <strong>${escapeHtml(h.label)}</strong>
          ${escapeHtml(h.body)}
        </div>`).join('');
      return `<section class="visual-section annotated-section">
        <div class="annotated-wrap">
          <img src="${v.src}" alt="${escapeHtml(v.caption || '')}" />
          ${hot}
        </div>
        ${v.caption ? `<p class="annotated-caption">${escapeHtml(v.caption)}</p>` : ''}
      </section>`;
    }
    return '';
  }

  // Build interleaved body: hero/cover, then visuals[0] if any, then intro+pull,
  // then any remaining visuals, then what-mattered, then closer.
  const visuals = lensView.visuals || [];
  const visualsBeforePull   = visuals.slice(0, 1);
  const visualsAfterPull    = visuals.slice(1, 3);
  const visualsAfterMattered = visuals.slice(3);

  out.innerHTML = `
    <section class="hero">
      <div class="hero-inner">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="../work-lensed.html?lens=${lens}">work · through ${escapeHtml(LENS_NAME[lens].toLowerCase())}</a>
          <span class="sep">/</span>
          <span>${escapeHtml(project.name)}</span>
        </nav>
        <span class="lens-chip">${escapeHtml(LENS_NAME[lens])} view</span>
        <p class="case-name-tiny">${escapeHtml(project.name)}</p>
        <h1 class="lens-headline">${lensView.headline}</h1>
        <p class="lens-deck">${escapeHtml(lensView.deck)}</p>
      </div>
      ${visuals.length === 0 ? `<figure class="hero-cover"><img src="${project.cover}" alt="${escapeHtml(project.name)}" /></figure>` : ''}
    </section>

    ${visualsBeforePull.map(renderVisual).join('')}

    <article class="body">
      <span class="annot">what we’re looking at</span>
      <p>${escapeHtml(project.deep.what_mattered_intro)}</p>

      <p class="pull">${escapeHtml(lensView.pull)}</p>
    </article>

    ${visualsAfterPull.map(renderVisual).join('')}

    <article class="body">
      <div class="what-mattered">
        <h3>What mattered, through this lens</h3>
        <ul>${lensView.mattered.map(m => `<li>${escapeHtml(m)}</li>`).join('')}</ul>
      </div>
    </article>

    ${visualsAfterMattered.map(renderVisual).join('')}

    <article class="body">
      <p>This is a <em>lens view</em> — a re-framing, not a replacement. The full case study has the artifacts, the process, and the things this lens chose to leave out. If you want the whole picture, open it below.</p>
    </article>

    <div class="cta-strip">
      <a class="cta cta-primary" href="${project.href}">read the full case study →</a>
      <a class="cta cta-ghost" href="../work-lensed.html?lens=${lens}">back to ${escapeHtml(LENS_NAME[lens].toLowerCase())}</a>
      <span class="cta-aside">or <a href="../work/">browse work as-is →</a></span>
    </div>

    <section class="switch-lens">
      <span class="switch-lens-label">try another lens on the same project →</span>
      <div class="switch-lens-buttons">${switchHtml}</div>
    </section>

    <div class="zoom-modal" id="zoom-modal" role="dialog" aria-label="Zoomed view">
      <button class="zoom-modal-close" aria-label="Close">×</button>
      <img id="zoom-img" src="" alt="" />
    </div>
  `;

  // wire up zoom-on-click
  const modal = document.getElementById('zoom-modal');
  const modalImg = document.getElementById('zoom-img');
  document.querySelectorAll('img[data-zoom]').forEach(img => {
    img.addEventListener('click', () => {
      modalImg.src = img.dataset.zoom;
      modalImg.alt = img.alt;
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });
  function closeModal() {
    modal.classList.remove('open');
    document.body.style.overflow = '';
  }
  modal.addEventListener('click', closeModal);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });

  // hypothesis cards — toggle expanded state on click
  document.querySelectorAll('.hyp-card').forEach(card => {
    card.addEventListener('click', () => {
      const open = card.getAttribute('aria-expanded') === 'true';
      card.setAttribute('aria-expanded', open ? 'false' : 'true');
    });
  });

  // journey columns — only one open at a time, but tap-to-toggle
  document.querySelectorAll('.journey-col').forEach(col => {
    col.addEventListener('click', () => {
      const wasOpen = col.getAttribute('aria-expanded') === 'true';
      document.querySelectorAll('.journey-col').forEach(c => c.setAttribute('aria-expanded', 'false'));
      if (!wasOpen) col.setAttribute('aria-expanded', 'true');
    });
  });

  // hotspots — click to pin tooltip open (mobile-friendly), click again or outside to close
  document.querySelectorAll('.hotspot').forEach(spot => {
    spot.addEventListener('click', e => {
      e.stopPropagation();
      const wasOpen = spot.classList.contains('is-open');
      document.querySelectorAll('.hotspot.is-open').forEach(s => s.classList.remove('is-open'));
      if (!wasOpen) spot.classList.add('is-open');
    });
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.hotspot.is-open').forEach(s => s.classList.remove('is-open'));
  });

  // tagline cycle — fade through draft taglines, lingering on the final pick
  const taglineRoot = document.querySelector('[data-tagline-cycle] .tagline-cycle');
  if (taglineRoot) {
    const items = Array.from(taglineRoot.querySelectorAll('.t'));
    if (items.length > 0) {
      let i = 0;
      items[0].classList.add('is-active');
      setInterval(() => {
        items[i].classList.remove('is-active');
        i = (i + 1) % items.length;
        items[i].classList.add('is-active');
      }, 3400);
    }
  }
}
</script>
</body>
