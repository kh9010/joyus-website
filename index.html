<style>
  /* :root tokens + body baseline come from styles.css */
  body { min-height: 100vh; }

  /* nav and foot styles come from /_partials/ — synced via scripts/sync-chrome.js */

  /* DOTS */
  .dot {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .d-pink   { background: var(--pink); }
  .d-cyan   { background: var(--cyan); }
  .d-yellow { background: var(--yellow); }

  /* ============ HERO — sparse stage, dots-led ============
     3-row grid: eyebrow top-left, input stage centered, tagline bottom-right. */
  .hero {
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
    padding: clamp(5rem, 10vh, 8rem) var(--x) clamp(2.5rem, 5vh, 4rem);
    width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .hero-inner {
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    position: relative;
    z-index: 2;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Scattered playful dots — fill the negative space the sparse layout opens up */
  /* The signature big dot used to sit top-right on every page; here it bleeds
     off the LEFT mid-edge so home doesn't repeat that top-right-accent structure.
     Size / colour / opacity unchanged. */
  .hero .dh1 { width: clamp(280px, 32vw, 480px); height: clamp(280px, 32vw, 480px); bottom: -8%; left: -16%; opacity:1; }
  .hero .dh2 { width: 64px; height: 64px; top: 66%; right: 16%; }
  .hero .dh3 { width: 28px; height: 28px; top: 16%; right: 20%; }
  /* dh4 sat behind the bottom-right tagline; relocated to mid-right so the magenta
     in the tagline doesn't have to fight a cyan field behind it */
  .hero .dh4 { width: 110px; height: 110px; top: 12%; right: 6%; }
  .hero .dh5 { width: 38px; height: 38px; top: 24%; left: 16%; }
  .hero .dh6 { width: 18px; height: 18px; bottom: 26%; right: 34%; }
  .hero .dh7 { width: 22px; height: 22px; top: 58%; left: 8%; }
  .hero .dh8 { width: 12px; height: 12px; top: 38%; left: 30%; }
  .hero .dh9 { width: 88px; height: 88px; top: -16px; left: 32%; opacity:1; }

  /* eyebrow pinned top-left of the hero (absolute so the stage can center
     in the full viewport, not between eyebrow and tagline) */
  /* .hero-eyebrow base styles come from styles.css.
     Homepage overrides: pin to top-left, yellow dot (not the page accent). */
  .hero-eyebrow {
    position: absolute;
    top: clamp(5rem, 10vh, 8rem);
    left: var(--x);
    z-index: 3;
    margin: 0;
  }
  .hero-eyebrow::before { background: var(--yellow); }

  /* === V13: Sparse stage. Input is the center of gravity. ===
     The 1fr middle row centers it vertically; max-width cap keeps it
     from sprawling to the page edges. */
  .hero-stage {
    width: 100%;
    max-width: 900px;
    min-width: 0;
    align-self: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
    gap: 1rem;
    position: relative;
  }
  .hero-h1 {
    font-family: var(--sans);
    font-weight: 500;
    font-size: clamp(1.2rem, 1.6vw, 1.5rem);
    line-height: 1;
    letter-spacing: -0.005em;
    color: var(--ink-soft);
    font-style: italic;
    margin: 0;
    text-align: left;
  }
  .hero-fill {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 0.4em;
    width: 100%;
    min-width: 0;
  }
  /* Field wraps the textarea + the grey faux-placeholder overlay; both share
     IDENTICAL type metrics so the dummy prompt sits exactly where the typed
     answer will appear. */
  .hero-field { position: relative; flex: 1 1 0; min-width: 0; }
  .hero-fill #intentInput,
  .hero-fauxph,
  .hero-caret {
    font-family: var(--sans);
    font-size: clamp(1.8rem, 3.6vw, 3rem);
    line-height: 1.15;
    letter-spacing: -0.04em;
    padding: 0 0.15em 0.1em;
  }
  /* The input is a textarea so a long need WRAPS to a new line (auto-grown in
     JS) instead of getting clipped on one line. */
  .hero-fill #intentInput {
    display: block;
    box-sizing: border-box;
    width: 100%;
    min-height: 1.3em;
    resize: none;
    overflow: hidden;
    font-weight: 700;
    color: var(--pink);
    background: transparent;
    border: 0;
    border-bottom: 5px solid var(--ink);
    outline: none;
    transition: border-color 0.25s;
  }
  .hero-fill #intentInput:focus { border-bottom-color: var(--pink); }
  /* Grey "dummy" prompt overlaid on the empty field. Crossfades between prompts
     (mirrors the services rel-in fade-up) — no typing caret, so it reads as
     placeholder text you replace, not live typing. Hidden once you focus/type. */
  .hero-fauxph {
    position: absolute;
    top: 0; left: 0; right: 0;
    pointer-events: none;
    font-weight: 500;
    color: var(--ink-fade);
    opacity: 0.6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-left: 0.55em;        /* clear the resting caret so they don't overlap */
    transition: opacity 0.34s ease, transform 0.34s ease;
  }
  .hero-fauxph.swap { opacity: 0; transform: translateY(6px); }
  .hero-field.active .hero-fauxph,
  .hero-field.filled .hero-fauxph { opacity: 0; }
  /* Resting caret — a calm pink "you can type here" marker at the field start.
     It stays PUT while the grey prompt crossfades, so it reads as a cursor, not
     another moving thing. Hidden on focus (the real textarea caret takes over)
     and once anything is typed. */
  /* Caret container shares the field's exact line-box (font/line-height/padding
     from the rule above) so the bar can sit on the SAME baseline as the text. */
  .hero-caret {
    position: absolute;
    top: 0; left: 0; right: 0;
    pointer-events: none;
  }
  .hero-caret i {
    display: inline-block;
    width: 0.07em;
    height: 0.74em;
    background: var(--pink);
    vertical-align: baseline;     /* sits ON the text baseline, not floating */
    animation: caretBlink 1.1s steps(1, end) infinite;
  }
  @keyframes caretBlink { 0%, 55% { opacity: 1; } 55.01%, 100% { opacity: 0; } }
  .hero-field.active .hero-caret,
  .hero-field.filled .hero-caret { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .hero-caret i { animation: none; opacity: 1; }
  }
  .hero-fill .submit {
    font-size: clamp(1.4rem, 2vw, 1.8rem);
    color: var(--ink-fade);
    background: transparent;
    border: 0;
    cursor: pointer;
    line-height: 1;
    transition: color 0.2s, transform 0.25s;
    font-family: var(--sans);
    font-weight: 500;
    flex-shrink: 0;
    align-self: flex-end;
    padding-bottom: 0.12em;
  }
  .hero-fill .submit:hover { color: var(--pink); transform: translateX(4px); }

  /* SUGGESTIONS — sits flush under the input, in the hero-stage frame.
     Lighter than a form dropdown — feels like a list of ideas opening up. */
  #intentSuggestions {
    position: absolute;
    top: calc(100% + 1.25rem);
    left: 0; right: 0;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(8px);
    border: 0;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(44, 53, 68, 0.10), 0 2px 6px rgba(44, 53, 68, 0.05);
    overflow: hidden;
    z-index: 30;
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #intentSuggestions.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .sug {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1.5rem;
    padding: 1.05rem 1.75rem;
    border-top: 1px solid rgba(44, 53, 68, 0.06);
    transition: background 0.15s, color 0.15s;
    cursor: pointer;
    text-decoration: none;
    color: var(--ink);
    position: relative;
  }
  .sug::before {
    content: "";
    position: absolute;
    left: 0.85rem;
    top: 1.45rem;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--pink);
    transition: transform 0.2s;
  }
  .sug:nth-child(2)::before { background: var(--cyan); }
  .sug:nth-child(3)::before { background: var(--yellow); }
  .sug:nth-child(4)::before { background: var(--pink); opacity: 0.6; }
  .sug:nth-child(5)::before { background: var(--cyan); opacity: 0.6; }
  .sug:first-child { border-top: 0; }
  .sug:hover { background: var(--bg); color: var(--pink); }
  .sug:hover::before { transform: scale(1.4); }
  .sug-text { font-size: 1rem; padding-left: 1rem; flex: 1; }
  .sug-dest {
    font-family: var(--hand);
    font-size: 1.15rem;
    color: var(--ink-fade);
    white-space: nowrap;
  }
  .sug:hover .sug-dest { color: var(--pink); }

  /* secondary entry — a hand-note under the field offering a browse path for
     visitors who'd rather not type. Absolute (like the old tagline) so it never
     changes the stage height the dropdown anchors to; fades out while the
     suggestions are open so the two never collide. */
  .hero-alt {
    position: absolute;
    /* mirror of .hero-eyebrow (top:clamp(5rem,10vh,8rem); left:var(--x)) so the
       browse-note sits symmetric to the eyebrow, bottom-right corner of the hero */
    bottom: clamp(5rem, 10vh, 8rem);
    right: var(--x);
    margin: 0;
    font-family: var(--hand);
    font-weight: 600;
    font-size: clamp(1.25rem, 1.9vw, 1.65rem);
    line-height: 1.05;
    color: var(--ink-soft);
    text-align: right;
    transform: rotate(-1.5deg);
    transition: opacity 0.2s ease;
    z-index: 3;
  }
  .hero-alt a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 2px solid var(--pink);
    white-space: nowrap;
  }
  .hero-alt a:hover { color: var(--pink); }
  /* dimmed while the suggestions dropdown is open (toggled in JS — the dropdown
     is no longer a DOM sibling now that .hero-alt is pinned to the hero corner) */
  .hero-alt.dimmed { opacity: 0; pointer-events: none; }

  /* ============ CLOSING ============
     .closing family styles come from styles.css; page-local dots only. */
  .closing .dx1 { width: 26px; height: 26px; bottom: 28%; left: 16%; }
  .closing .dx2 { width: 14px; height: 14px; top: 26%; right: 26%; }
  .closing .dx3 { width: 60px; height: 60px; bottom: 16%; left: 8%; }

  /* foot comes from /_partials/foot.html */

  @media (max-width: 720px) {
    /* keep the lead line small — DO NOT inflate it */
    .hero-h1 { font-size: 1.3rem !important; }
    .hero-fill #intentInput,
    .hero-fauxph,
    .hero-caret {
      font-size: clamp(1.7rem, 7.5vw, 2.5rem);
    }
    .hero-fill #intentInput { border-bottom-width: 4px; }
    /* declutter the dot scatter on mobile */
    .hero .dh9 { display: none; }
    .hero .dh4 { width: 60px; height: 60px; right: 4%; top: 38%; }
    .hero .dh1 { width: 220px; height: 220px; left: -30%; right: auto; opacity:1; }
    .hero .dh2 { width: 36px; height: 36px; }
    .hero .dh3 { width: 18px; height: 18px; }
    /* on mobile, keep the note tucked under the input, left-aligned */
    .hero-alt { transform: rotate(-1deg); right: auto; left: var(--x); bottom: clamp(2.5rem, 5vh, 4rem); text-align: left; }
    .hero-inner { gap: 1.5rem; }
    .hero-eyebrow { font-size: 0.72rem; }
    /* dropdown: inline so it doesn't get covered by mobile keyboard, BUT
       collapse to 0 height when not visible — otherwise it inflates the
       .hero-stage and pushes the input above center */
    #intentSuggestions {
      position: relative;
      top: auto;
      margin-top: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, margin-top 0.3s ease, opacity 0.25s ease;
    }
    #intentSuggestions.visible {
      max-height: 80vh;
      margin-top: 1.5rem;
    }
    .closing .dx1, .closing .dx2 { display: none; }
  }
</style>
</head>

<!-- Single source of truth for the top nav.
     Sync into pages by running:  node scripts/sync-chrome.js
      → path prefix to repo root (e.g. "" or "../")
     Colors use the tokens declared in styles.css :root. -->
<style>
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 1.25rem clamp(1.5rem, 4vw, 3rem);
    padding-top: max(1.25rem, env(safe-area-inset-top));
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 500;
    background: rgba(250, 247, 242, 0.88);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    font-family: var(--sans);
  }
  .nav .nav-logo { display: inline-flex; align-items: center; line-height: 1; position: relative; z-index: 510; }
  .nav .nav-logo img { height: 32px; width: auto; display: block; }
  .nav .nav-links {
    display: flex; gap: 1.75rem; align-items: center;
    list-style: none; padding: 0; margin: 0;
  }
  .nav .nav-links a {
    font-size: 0.92rem;
    color: var(--ink-soft);
    text-decoration: none;
    font-weight: 400;
    padding-bottom: 2px;
    border-bottom: 1.5px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  .nav .nav-links a:hover { color: var(--pink); }
  .nav .nav-links a.active {
    color: var(--ink);
    font-weight: 500;
    border-bottom-color: var(--pink);
  }
  .nav .nav-cta { color: var(--ink); font-weight: 500; }
  .nav .nav-cta:hover { color: var(--pink); }

  /* Hamburger button — hidden on desktop */
  .nav-toggle {
    display: none;
    width: 44px; height: 44px;
    background: transparent; border: 0; padding: 0;
    cursor: pointer; position: relative; z-index: 510;
    align-items: center; justify-content: center;
  }
  .nav-toggle span {
    display: block; width: 24px; height: 2px;
    background: var(--ink); border-radius: 2px;
    position: absolute;
    transition: transform 0.25s ease, top 0.25s ease, opacity 0.2s;
  }
  .nav-toggle span:nth-child(1) { top: 14px; }
  .nav-toggle span:nth-child(2) { top: 21px; }
  .nav-toggle span:nth-child(3) { top: 28px; }
  .nav-toggle[aria-expanded="true"] span:nth-child(1) { top: 21px; transform: rotate(45deg); }
  .nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .nav-toggle[aria-expanded="true"] span:nth-child(3) { top: 21px; transform: rotate(-45deg); }

  @media (max-width: 720px) {
    .nav {
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      background: rgba(250, 247, 242, 0.95);
    }
    .nav-toggle { display: inline-flex; }
    .nav .nav-links {
      position: fixed;
      inset: 0;
      padding: 6rem clamp(1.5rem, 4vw, 3rem) 3rem;
      padding-top: max(6rem, calc(env(safe-area-inset-top) + 5rem));
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 1.75rem;
      background: var(--white);
      border-left: 4px solid var(--ink);
      box-shadow: -16px 0 48px rgba(44, 53, 68, 0.22);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 505;
    }
    .nav .nav-links.open { transform: translateX(0); }
    .nav .nav-links a {
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--ink);
    }
    .nav .nav-links a.active { border-bottom-color: var(--pink); }
    .nav .nav-cta { font-size: 1.6rem; }
  }
</style>

    <span></span><span></span><span></span>
  </button>
  <div class="nav-links" id="navMenu">
    <a href="work/" data-nav="work">Work</a>
    <a href="services.html" data-nav="services">Services</a>
    <a href="workshops.html" data-nav="workshops">Workshops</a>
    <a href="podcast.html" data-nav="podcast">Podcast</a>

<script>
  (function(){
    var path = window.location.pathname;
    var active = null;
    if (/\/work(\/|$)/.test(path)) active = 'work';
    else if (/services\.html/.test(path)) active = 'services';
    else if (/workshops/.test(path)) active = 'workshops';
    else if (/podcast/.test(path)) active = 'podcast';
    else if (/about\.html/.test(path)) active = 'about';
    else if (/say-hi\.html/.test(path)) active = 'say-hi';
    if (active) {
      var links = document.querySelectorAll('.nav .nav-links a[data-nav]');
      for (var i = 0; i < links.length; i++) {
        if (links[i].getAttribute('data-nav') === active) {
          links[i].classList.add('active');
        }
      }
    }
    // hamburger toggle
    var toggle = document.querySelector('.nav-toggle');
    var menu = document.querySelector('.nav .nav-links');
    if (toggle && menu) {
      var close = function() {
        menu.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
      };
      toggle.addEventListener('click', function(e) {
        e.stopPropagation();
        var open = menu.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        document.body.style.overflow = open ? 'hidden' : '';
      });
      // close on link tap
      menu.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', close);
      });
      // close on escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && menu.classList.contains('open')) close();
      });
    }
  })();
</script>

  <!-- Firebase (compat) — best-effort capture of typed intents. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="intent-box.js"></script>
  <script>
    // Autocomplete + Enter-routing live in intent-box.js. We pass NO `prompts`
    // (so its typewriter stays off) and instead drive a cursor-free, crossfading
    // grey "dummy" prompt over the field below — and let the field grow so a
    // long need wraps instead of getting cut off.
    initIntentBox({ page: 'index' });

    // Fade the corner browse-note while the suggestions dropdown is open. It used
    // to be a CSS sibling of #intentSuggestions; now that it's pinned to the hero
    // corner we watch the dropdown's class and mirror it onto .hero-alt.
    (function () {
      var sug = document.getElementById('intentSuggestions');
      var alt = document.querySelector('.hero-alt');
      if (!sug || !alt || !window.MutationObserver) return;
      new MutationObserver(function () {
        alt.classList.toggle('dimmed', sug.classList.contains('visible'));
      }).observe(sug, { attributes: true, attributeFilter: ['class'] });
    })();

    (function () {
      var ta    = document.getElementById('intentInput');
      var faux  = document.getElementById('intentFaux');
      var field = ta && ta.closest('.hero-field');
      var form  = ta && ta.closest('.hero-fill');
      if (!ta || !faux || !field) return;

      var PROMPTS = [
        'to tell a better story',
        'to launch a product from zero',
        'to build a brand that feels like me',
        'to run a workshop for my team',
        'to get help with my pitch deck',
        'to just think with someone',
        'to find a conversation worth listening to',
        'to hear founders talk burnout',
        'to figure out where ai fits',
        'to question what success means'
      ];
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Auto-grow: the field's height follows the typed answer (wraps, never clips).
      function grow() { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
      // The grey dummy text is gone the moment you're in the field or have typed.
      function sync() {
        field.classList.toggle('active', document.activeElement === ta);
        field.classList.toggle('filled', ta.value.length > 0);
      }
      ta.addEventListener('input', function () { grow(); sync(); });
      ta.addEventListener('focus', sync);
      ta.addEventListener('blur', sync);

      // Enter submits (a textarea would otherwise insert a newline). Shift+Enter = newline.
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (form && form.requestSubmit) form.requestSubmit();
          else if (form) form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        }
      });

      // Crossfade the grey prompt — fade out + 6px down, swap, fade back in
      // (the services rel-in fade, no caret). Pauses while the field is in use.
      var i = 0;
      faux.textContent = PROMPTS[0];
      grow();
      if (!reduce) {
        setInterval(function () {
          if (document.activeElement === ta || ta.value) return;
          faux.classList.add('swap');
          setTimeout(function () {
            i = (i + 1) % PROMPTS.length;
            faux.textContent = PROMPTS[i];
            faux.classList.remove('swap');
          }, 340);
        }, 2600);
      }
    })();
  </script>

</body>
</html>
