<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Words fill the box</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #2C3544; font-family: 'Space Grotesk', system-ui, sans-serif }
header { position: fixed; left: 0; right: 0; top: 0; padding: 18px 28px; display: flex; justify-content: space-between; font-size: 17px }
header b { font-size: 21px } header span { color: #54606F }
#box { position: fixed; left: 28px; top: 78px; width: 560px; height: 520px; min-width: 150px; min-height: 150px; max-width: calc(100vw - 44px); max-height: calc(100vh - 96px); box-sizing: border-box; outline: 1.5px dashed #b9c0c9; outline-offset: 7px; resize: both; overflow: hidden }
#box div { position: absolute; left: 0; white-space: nowrap; font-family: 'Roboto Flex', sans-serif; text-transform: uppercase; line-height: 1; transform-origin: 0 0; font-optical-sizing: none }
#grip { position: fixed; width: 26px; height: 26px; border-radius: 50%; background: #E91E7B; cursor: nwse-resize; touch-action: none }
#probe { position: absolute; left: -9999px; top: 0; white-space: nowrap; font-family: 'Roboto Flex', sans-serif; text-transform: uppercase; font-size: 200px; line-height: 1; font-optical-sizing: none }
@media (max-width: 600px) { #box { left: 16px; width: calc(100vw - 44px); height: 430px } header { padding: 14px 16px } }
</style>
</head>
<body>
<header><b>joyus</b><span>drag the pink dot</span></header>
<div id="box"></div><div id="grip"></div><span id="probe"></span>
<script type="module" src="c-script.js"></script>
</body>
</html>
