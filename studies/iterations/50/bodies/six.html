<style>
  /* six Tuesdays at once (46 · 2): the six evenings side by side; the coffeeshops, bars and homes light up.
     50: 46 · 2's columns exactly, as they were; Kahran, 27 Oct: "I don't want you to change the columns.
     I just wanted you to make it more readable within the columns. Like, just add some more paragraph
     breaks." So the grid, its gaps and its breakpoints are 46 · 2's, line for line (check.cjs measures
     both pages and holds them equal); inside each column the give is one sentence to a paragraph, with
     air between them, and a rule under the name. The hovers are 49's (a for all six, T-a). */
  .ask{font:500 clamp(1.3rem,2.4vw,1.9rem)/1.2 var(--sans);letter-spacing:-.02em;margin:0}
  .lead{font:15px var(--sans);margin:14px 0 0}
  .flip{display:flex;gap:6px;margin:14px 0 0}
  .flip button{font:14px var(--sans);border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:#fff;color:var(--ink);cursor:pointer}
  .flip button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  [hidden]{display:none!important}
  .six{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:16px;border-top:1.5px solid var(--ink);padding-top:12px}
  .col h3{font:600 14px/1.25 var(--sans);margin:0 0 10px;min-height:2.5em}
  .col ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .col li{font:13px/1.35 var(--mono);color:var(--mute);border:1px solid var(--box);padding:8px;min-height:3.4em}
  .col li.hit{color:var(--ink);border-color:var(--ink);background:var(--box)}
  /* inside a column, with EWC: one sentence to a paragraph, air between them (the columns don't move) */
  .col .with{border-top:1px solid var(--line);padding:10px 0 20px}
  .col .with p{margin:0;font:14px/1.5 var(--sans)}
  .col .with p + p{margin-top:12px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
  .hint{font:13px var(--sans);color:var(--mute);margin:14px 0 0;display:flex;align-items:center;gap:10px}
  .hint .all{font:13px var(--sans);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:#fff;color:var(--ink);cursor:pointer}
  .hint .all[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .col{position:relative;cursor:pointer;outline:none}
  .hov{display:none}
  .hov .opt{margin:0;font:14px/1.5 var(--sans)}
  /* T-a: a card over the column, under the name; --dx slides it back on screen (set by the script) */
  .col:is(:hover,:focus-visible,.is-open) .hov{display:block;position:absolute;z-index:5;left:-8px;top:var(--dy,30px);width:max(calc(100% + 16px),260px);max-width:calc(100vw - 32px);box-sizing:border-box;transform:translateX(var(--dx,0px));background:#fff;border:1px solid var(--ink);padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
  /* show all: every card open, in place (for phones) */
  body.show-all .col .hov{display:block!important;position:static!important;box-shadow:none!important;width:auto!important;max-width:none!important;transform:none!important;background:#fff;border:0;border-left:3px solid var(--ink);padding:10px 12px;margin:0 0 12px}
  @media (max-width:1000px){ .six{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:560px){ .six{grid-template-columns:1fr 1fr} }
</style>
<section class="body" aria-labelledby="bh">
  <div class="body-h"><h2 id="bh" class="ask">{{w:t.ask}}</h2></div>
  {{SIX}}
</section>
<script>
  // keep an open card on screen, 16px from either edge, and just under the member's name
  const fit = (c) => {
    const h = c.querySelector('.hov'), n = c.querySelector('h3');
    h.style.setProperty('--dy', Math.round(n.offsetTop + n.offsetHeight + 4) + 'px'); h.style.setProperty('--dx', '0px');
    const r = h.getBoundingClientRect(), vw = document.documentElement.clientWidth, g = 16;
    let dx = 0; if (r.right > vw - g) dx = vw - g - r.right; if (r.left + dx < g) dx = g - r.left;
    h.style.setProperty('--dx', Math.round(dx) + 'px');
  };
  const cols = [...document.querySelectorAll('.col')];
  cols.forEach(c => {
    ['mouseenter', 'focus'].forEach(ev => c.addEventListener(ev, () => fit(c)));
    c.addEventListener('click', (e) => { if (e.target.closest('button')) return; const was = c.classList.contains('is-open'); cols.forEach(x => x.classList.remove('is-open')); c.classList.toggle('is-open', !was); if (!was) fit(c); });
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.col')) cols.forEach(x => x.classList.remove('is-open')); });
  addEventListener('resize', () => cols.filter(c => c.classList.contains('is-open')).forEach(fit));
  const all = document.querySelector('.hint .all');
  all.addEventListener('click', () => { const on = all.getAttribute('aria-pressed') !== 'true'; all.setAttribute('aria-pressed', on); document.body.classList.toggle('show-all', on); });
  const fs = [...document.querySelectorAll('.flip button')];
  fs.forEach(b => b.addEventListener('click', () => { const on = b.dataset.with === '1'; fs.forEach(x => x.setAttribute('aria-pressed', x === b)); document.querySelectorAll('.col').forEach(c => { c.querySelector('.without').hidden = on; c.querySelector('.with').hidden = !on; }); }));
</script>
