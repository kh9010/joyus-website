<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>121 / the four, together · Joyus homepage</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
<style>
/* the four variants live, one scroll for all four: this page's scroll moves every frame to the same point of its own page */
:root{--ink:#2C3544;--soft:#54606F;--line:rgba(44,53,68,.16)}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.4 Montserrat,system-ui,sans-serif;color:var(--ink);background:#f4f4f2}
#run{height:900vh}
#stage{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:10px 12px;gap:8px}
.bar{display:flex;align-items:center;gap:6px;flex:none}
.bar button{font:500 13px Montserrat,sans-serif;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar .p{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--soft);font-size:12px}
#frames{flex:1;min-height:0;display:grid;gap:12px;justify-content:center;align-content:center}
.f{display:flex;flex-direction:column;gap:4px}
.f a{font-weight:600;font-size:13px;text-decoration:none;color:var(--ink)}
.f a span{font-weight:400;color:var(--soft);margin-left:6px}
.box{overflow:hidden;background:#fff;border:1px solid var(--line);position:relative}
/* the frame scrolls only from here: the wheel always lands on this page */
.box iframe{border:0;position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
</style></head><body>
<div id="run"><div id="stage">
<div class="bar"><button type="button" data-m="wide" aria-pressed="true">Wide</button><button type="button" data-m="phone" aria-pressed="false">Phone</button><span class="p" id="p"></span></div>
<div id="frames"></div>
</div></div>
<script>
const V = [['a', 'Vibrant', 'six colour pairs, one each'], ['b', 'Energy', 'a line through each person'], ['c', 'Solved', 'loose parts snap square'], ['d', 'Grounded', 'a floor, and shelves']];
const SIZE = { wide: [1440, 900], phone: [390, 844] };
const frames = document.getElementById('frames'), run = document.getElementById('run');
let mode = 'wide';
const cells = V.map(([v, name, line]) => {
  const f = document.createElement('div'); f.className = 'f';
  f.innerHTML = `<a href="${v}.html" target="_blank" rel="noopener">${v} ${name}<span>${line}</span></a><div class="box"><iframe title="${name}" src="${v}.html" tabindex="-1" scrolling="no"></iframe></div>`;
  frames.append(f); return { box: f.querySelector('.box'), frame: f.querySelector('iframe') };
});
function layout() {
  const [w, h] = SIZE[mode], cols = mode === 'wide' ? 2 : 4, rows = 4 / cols;
  const r = frames.getBoundingClientRect(), gap = 12, label = 22;
  const s = Math.min((r.width - gap * (cols - 1)) / cols / w, (r.height - gap * (rows - 1) - label * rows) / rows / h);
  frames.style.gridTemplateColumns = `repeat(${cols}, ${Math.floor(w * s)}px)`;
  for (const c of cells) { c.box.style.width = Math.floor(w * s) + 'px'; c.box.style.height = Math.floor(h * s) + 'px'; Object.assign(c.frame.style, { width: w + 'px', height: h + 'px', transform: `scale(${s})` }); }
  sync();
}
function sync() {
  const p = Math.min(1, Math.max(0, scrollY / (run.offsetHeight - innerHeight)));
  document.getElementById('p').textContent = Math.round(p * 100) + '%';
  for (const c of cells) { const w = c.frame.contentWindow; if (!w || !w.document.body) continue; const d = w.document.documentElement; w.scrollTo(0, p * (d.scrollHeight - w.innerHeight)); }
}
document.querySelector('.bar').addEventListener('click', e => { const b = e.target.closest('button[data-m]'); if (!b) return; mode = b.dataset.m; document.querySelectorAll('.bar button[data-m]').forEach(x => x.setAttribute('aria-pressed', x === b)); layout(); setTimeout(sync, 300); });
addEventListener('scroll', () => requestAnimationFrame(sync), { passive: true });
addEventListener('resize', layout);
for (const c of cells) c.frame.addEventListener('load', () => setTimeout(sync, 200));
layout();
</script>
</body></html>
