<style>
  /* 4 · the cast: a playbill. Who is in it, by where they come from; then the parts the room needs, which are verbs */
  .bill-h{font:12px var(--mono);color:var(--mute);font-weight:400;letter-spacing:.08em;text-transform:uppercase;margin:28px 0 8px;text-align:center}
  .bill{list-style:none;margin:0 auto;padding:0;max-width:820px}
  .bill li{display:grid;grid-template-columns:auto 1fr minmax(0,1.3fr);gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--box)}
  .bill b{font:500 1.2rem var(--sans);letter-spacing:-.015em}
  .bill .dots{border-bottom:1px dotted var(--line);transform:translateY(-4px)}
  .bill .from{font-size:14px;color:var(--ink)}
  .bill .from small{font:11px var(--mono);color:var(--mute);margin-right:6px}
  .bill .from i{font-style:normal;color:var(--mute);margin:0 6px}
  .parts{list-style:none;margin:0 auto;padding:0;max-width:820px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1.5px solid var(--ink)}
  .parts li{padding:14px 12px 14px 0;border-bottom:1px solid var(--box)}
  .parts b{display:block;font:500 1.3rem var(--sans);letter-spacing:-.02em}
  .parts small{display:block;font:12px/1.4 var(--mono);color:var(--mute);margin-top:4px}
  .rule{max-width:820px;margin:20px auto 0;font:500 1.15rem/1.35 var(--sans);text-align:center}
  @media (max-width:760px){ .bill li{grid-template-columns:1fr} .bill .dots{display:none} }
</style>
<section class="body">
{{CAST}}
</section>
