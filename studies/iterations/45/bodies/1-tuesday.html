<style>
  /* 1 · a Tuesday night: the workshop's question, asked of each member; their evening is where they go, then the club */
  .ask{font:500 clamp(1.3rem,2.4vw,1.9rem)/1.2 var(--sans);letter-spacing:-.02em;margin:0}
  .pick{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
  .pick button,.flip button{font:14px var(--sans);border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:#fff;color:var(--ink);cursor:pointer}
  .pick button[aria-pressed="true"],.flip button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .flip{display:flex;gap:6px;margin:22px 0 0;align-items:center}
  .flip small{font:12px var(--mono);color:var(--mute);margin-left:10px}
  .night{margin-top:14px;border-top:1.5px solid var(--ink)}
  .night[hidden],.night [hidden]{display:none}
  .without{list-style:none;margin:0;padding:0;counter-reset:n}
  .without li{display:grid;grid-template-columns:2.2em minmax(0,1fr) minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--box);counter-increment:n;align-items:baseline}
  .without li::before{content:counter(n);font:12px var(--mono);color:var(--mute)}
  .without b{font:500 1.15rem/1.3 var(--sans);letter-spacing:-.01em}
  .without .where{font:13px var(--mono);color:var(--mute)}
  .with{font:500 clamp(1.15rem,2vw,1.5rem)/1.35 var(--sans);letter-spacing:-.015em;margin:0;padding:18px 0;max-width:46ch}
  .with b{display:block;font:12px var(--mono);color:var(--mute);margin-bottom:8px;font-weight:400}
  @media (max-width:760px){ .without li{grid-template-columns:2em 1fr} .without .where{grid-column:2} }
</style>
<section class="body" aria-labelledby="bh-1">
  <div class="body-h"><h2 id="bh-1" class="ask">{{w:t.ask}}</h2></div>
  {{TUESDAY}}
  <div class="flip" role="group"><button type="button" aria-pressed="true" data-with="0">{{w:t.without}}</button><button type="button" aria-pressed="false" data-with="1">{{w:t.with}}</button><small>{{w:t.cue}}</small></div>
</section>
<script>
  const bs = [...document.querySelectorAll('.pick button')], ns = [...document.querySelectorAll('.night')], fs = [...document.querySelectorAll('.flip button')];
  let withEWC = false;
  const show = () => ns.forEach(n => { n.querySelector('.without').hidden = withEWC; n.querySelector('.with').hidden = !withEWC; });
  bs.forEach(b => b.addEventListener('click', () => { bs.forEach(x => x.setAttribute('aria-pressed', x === b)); ns.forEach(n => { n.hidden = n.dataset.p !== b.dataset.p; }); }));
  fs.forEach(b => b.addEventListener('click', () => { withEWC = b.dataset.with === '1'; fs.forEach(x => x.setAttribute('aria-pressed', x === b)); show(); }));
</script>
