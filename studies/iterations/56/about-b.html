<style>

weather. An MFA in Writing and Poetics underway at the Jack Kerouac School, Naropa."},{"who":"k","t":"I’m learning Kathak from Rachna Nivas in New York. I’m married to Gourav: we eloped in Telluride, in the snow, and did it again in Jaisalmer with 150 people a year later."},{"who":"k","t":"Write to me. Especially if you are drawing up your own contract with the world instead of signing the one you were handed: what it gives you, what you give back, and which of the settled questions you are asking again. Tell me what’s going on. K"},{"who":"k","t":"now: Tools, with Claude. MFA in poetry at Naropa’s Kerouac School. Kathak at the Kathak Legacy Project."},{"who":"k","t":"2025: Board of TomboyX. A panel in Kauai, seven StartOut talks."},{"who":"k","t":"2024: Poem Films, with Divya Tak. SEEN V, Boulder."},{"who":"k","t":"2022: Joyus Studio. How the World Works, a first book. Jaisalmer."},{"who":"k","t":"2021: Telluride."},{"who":"k","t":"2017: Tres Monos Capital, with Sweta Jagirdar and Sahil Sagar."},{"who":"k","t":"2015: Vidyanext, Bangalore, until 2019."},{"who":"k","t":"2012: Aditi Technologies, then Symphony Teleca: product and programmes across the US, India and Russia."},{"who":"k","t":"2009: Microsoft, after an internship in the House of Commons."},{"who":"k","t":"2006: Tufts: computer science and economics, and the Tufts Daily. A year at University College London."}];
