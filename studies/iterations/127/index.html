<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>127 / EWC on white, no lines, six typefaces to pick from — Joyus homepage — Studies</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap">
<link rel="stylesheet" href="../../study.css">
<style>
.item { display: grid; grid-template-columns: 28px 1fr; gap: 0 14px; padding: 18px 0; border-top: 1px solid var(--line) }
.item:last-of-type { border-bottom: 1px solid var(--line) }
.item input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: #222; cursor: pointer }
.item h3 { margin: 0 0 4px; font-size: 16px } .item h3 label { cursor: pointer }
.item.picked { background: var(--surface); margin: 0 -14px; padding-left: 14px; padding-right: 14px }
.picks { position: sticky; top: 0; z-index: 3; background: #fff; border-bottom: 1px solid var(--line); padding: 10px 0; margin: 0 0 8px; display: flex; gap: 16px; align-items: center; font-size: 13.5px }
.picks button { font: inherit; background: #222; color: #fff; border: 0; padding: 6px 12px; cursor: pointer }
.picks button.quiet { background: transparent; color: var(--ink-2); padding: 6px 4px }
.picks .count { color: var(--ink-2) }
.v { display: grid; grid-template-columns: 1fr 1fr .42fr; gap: 12px; align-items: start; margin: 10px 0 0 }
.v img { width: 100%; border: 1px solid var(--line) }
.item h3 a, .item h3 small { font-weight: 400; font-size: 13px; color: var(--ink-2); margin-left: 6px }
</style>
</head>
<body>
<main>
<h1>EWC on white, no lines, six typefaces to pick from</h1>
<div class="picks"><span class="count" id="count">0 picked</span><button id="copy">Copy picks</button><button class="quiet" id="clear">Clear</button></div>

<div class="item" data-id="1"><input type="checkbox" id="space"><div>
<h3><label for="space">Space Grotesk</label> <small>today's</small> <a href="f-space.html">open</a></h3>
<div class="v"><a class="zoom" href="shots/space-wide-third.png"><img src="shots/space-wide-third.png" alt="Space Grotesk, the host arriving"></a><a class="zoom" href="shots/space-wide-full.png"><img src="shots/space-wide-full.png" alt="Space Grotesk, all six"></a><a class="zoom" href="shots/space-phone-third.png"><img src="shots/space-phone-third.png" alt="Space Grotesk on a phone"></a></div>
</div></div>
<div class="item" data-id="2"><input type="checkbox" id="bricolage"><div>
<h3><label for="bricolage">Bricolage Grotesque</label> <a href="f-bricolage.html">open</a></h3>
<div class="v"><a class="zoom" href="shots/bricolage-wide-third.png"><img src="shots/bricolage-wide-third.png" alt="Bricolage Grotesque, the host arriving"></a><a class="zoom" href="shots/bricolage-wide-full.png"><img src="shots/bricolage-wide-full.png" alt="Bricolage Grotesque, all six"></a><a class="zoom" href="shots/bricolage-phone-third.png"><img src="shots/bricolage-phone-third.png" alt="Bricolage Grotesque on a phone"></a></div>
</div></div>
<div class="item" data-id="3"><input type="checkbox" id="instrument"><div>
<h3><label for="instrument">Instrument Sans</label> <a href="f-instrument.html">open</a></h3>
<div class="v"><a class="zoom" href="shots/instrument-wide-third.png"><img src="shots/instrument-wide-third.png" alt="Instrument Sans, the host arriving"></a><a class="zoom" href="shots/instrument-wide-full.png"><img src="shots/instrument-wide-full.png" alt="Instrument Sans, all six"></a><a class="zoom" href="shots/instrument-phone-third.png"><img src="shots/instrument-phone-third.png" alt="Instrument Sans on a phone"></a></div>
</div></div>
<div class="item" data-id="4"><input type="checkbox" id="schibsted"><div>
<h3><label for="schibsted">Schibsted Grotesk</label> <a href="f-schibsted.html">open</a></h3>
<div class="v"><a class="zoom" href="shots/schibsted-wide-third.png"><img src="shots/schibsted-wide-third.png" alt="Schibsted Grotesk, the host arriving"></a><a class="zoom" href="shots/schibsted-wide-full.png"><img src="shots/schibsted-wide-full.png" alt="Schibsted Grotesk, all six"></a><a class="zoom" href="shots/schibsted-phone-third.png"><img src="shots/schibsted-phone-third.png" alt="Schibsted Grotesk on a phone"></a></div>
</div></div>
<div class="item" data-id="5"><input type="checkbox" id="familjen"><div>
<h3><label for="familjen">Familjen Grotesk</label> <a href="f-familjen.html">open</a></h3>
<div class="v"><a class="zoom" href="shots/familjen-wide-third.png"><img src="shots/familjen-wide-third.png" alt="Familjen Grotesk, the host arriving"></a><a class="zoom" href="shots/familjen-wide-full.png"><img src="shots/familjen-wide-full.png" alt="Familjen Grotesk, all six"></a><a class="zoom" href="shots/familjen-phone-third.png"><img src="shots/familjen-phone-third.png" alt="Familjen Grotesk on a phone"></a></div>
</div></div>
<div class="item" data-id="6"><input type="checkbox" id="dmsans"><div>
<h3><label for="dmsans">DM Sans</label> <a href="f-dmsans.html">open</a></h3>
<div class="v"><a class="zoom" href="shots/dmsans-wide-third.png"><img src="shots/dmsans-wide-third.png" alt="DM Sans, the host arriving"></a><a class="zoom" href="shots/dmsans-wide-full.png"><img src="shots/dmsans-wide-full.png" alt="DM Sans, all six"></a><a class="zoom" href="shots/dmsans-phone-third.png"><img src="shots/dmsans-phone-third.png" alt="DM Sans on a phone"></a></div>
</div></div>
</main>
<script type="module">
const KEY = 'study-127-picks';
const boxes = [...document.querySelectorAll('.item input[type=checkbox]')];
const count = document.getElementById('count');
let picks = new Set();
try { const s = localStorage.getItem(KEY); if (s) picks = new Set(JSON.parse(s)); } catch {}
function paint() {
  for (const b of boxes) { b.checked = picks.has(b.id); b.closest('.item').classList.toggle('picked', b.checked); }
  count.textContent = picks.size + ' picked';
  try { localStorage.setItem(KEY, JSON.stringify([...picks])); } catch {}
}
for (const b of boxes) b.addEventListener('change', () => { b.checked ? picks.add(b.id) : picks.delete(b.id); paint(); });
document.getElementById('clear').onclick = () => { picks.clear(); paint(); };
document.getElementById('copy').onclick = async () => {
  const lines = boxes.filter(b => picks.has(b.id)).map(b => b.id + '  ' + b.closest('.item').querySelector('h3').textContent.trim());
  const text = lines.length ? lines.join('\n') : '(nothing picked)';
  try { await navigator.clipboard.writeText(text); count.textContent = 'copied ' + lines.length; setTimeout(paint, 1200); } catch { prompt('Picks', text); }
};
paint();
</script>
</body>
</html>
