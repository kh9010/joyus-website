<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>J masks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=Rubik:wght@900&family=Archivo+Black&family=Shrikhand&family=Bowlby+One&family=Anton&family=Lilita+One&family=Alfa+Slab+One&family=Bungee&family=Chango&family=Luckiest+Guy&family=Fredoka:wght@700&family=Rowdies:wght@700&family=Bagel+Fat+One&family=Pacifico&family=Lobster&family=Kaushan+Script&family=Courgette&family=Oleo+Script:wght@700&family=Leckerli+One&family=Fugaz+One&family=Permanent+Marker&family=Bangers&family=Modak&family=Abril+Fatface&family=Ultra&family=Sedgwick+Ave+Display&family=Tilt+Warp&family=Calistoga&family=Poetsen+One&family=Sansita+Swashed:wght@900&family=Gluten:wght@900&display=block">
</head>
<body><script type="module">
/* The J in each candidate font, drawn exactly as Study 19's mask (and the
   bake's glyphField): 320px canvas, the glyph fitted to 84% of it.
   Study 28: the fourteen from 27, plus eighteen of other kinds (Divya,
   13 Oct: more cursive, or otherwise): scripts, marker, comic, fat serifs.
   legible.mjs decides which stay. */
const FONTS = [
  ['unbounded', 900, '"Unbounded"'],
  ['rubik', 900, '"Rubik"'],                    // rounded grotesque
  ['archivo-black', 400, '"Archivo Black"'],    // plain, poster-heavy grotesque
  ['shrikhand', 400, '"Shrikhand"'],            // heavy italic with a swash
  ['bowlby', 400, '"Bowlby One"'],              // condensed poster slab-ish
  ['anton', 400, '"Anton"'],                    // tall condensed poster sans
  ['lilita', 400, '"Lilita One"'],              // rounded, friendly
  ['alfa-slab', 400, '"Alfa Slab One"'],        // fat slab serif
  ['bungee', 400, '"Bungee"'],                  // squared signage
  ['chango', 400, '"Chango"'],                  // ultra fat, a little italic
  ['luckiest-guy', 400, '"Luckiest Guy"'],      // hand-drawn cartoon
  ['fredoka', 700, '"Fredoka"'],                // soft geometric
  ['rowdies', 700, '"Rowdies"'],                // boxy, slightly playful
  ['bagel-fat', 400, '"Bagel Fat One"'],        // bubbly, puffed
  /* new in 28: cursive */
  ['pacifico', 400, '"Pacifico"'],              // surf script
  ['lobster', 400, '"Lobster"'],                // bold connected script
  ['kaushan', 400, '"Kaushan Script"'],         // brush script
  ['courgette', 400, '"Courgette"'],            // soft upright script
  ['oleo', 700, '"Oleo Script"'],               // round bold script
  ['leckerli', 400, '"Leckerli One"'],          // fat bakery script
  ['sansita-swashed', 900, '"Sansita Swashed"'], // swashed italic
  /* new in 28: otherwise */
  ['fugaz', 400, '"Fugaz One"'],                // racing italic
  ['marker', 400, '"Permanent Marker"'],        // felt marker
  ['bangers', 400, '"Bangers"'],                // comic shout
  ['modak', 400, '"Modak"'],                    // ultra fat, Indian display
  ['abril', 400, '"Abril Fatface"'],            // fat didone serif
  ['ultra', 400, '"Ultra"'],                    // fat slab serif, squarer than Alfa
  ['sedgwick', 400, '"Sedgwick Ave Display"'],  // graffiti marker
  ['tilt-warp', 400, '"Tilt Warp"'],            // warped sans
  ['calistoga', 400, '"Calistoga"'],            // western-ish bold serif
  ['poetsen', 400, '"Poetsen One"'],            // soft heavy sans
  ['gluten', 900, '"Gluten"'],                  // doughy fat sans
];
const R = 320, out = {};
for (const [name, wt, fam] of FONTS) {
  await document.fonts.load(`${wt} 100px ${fam}`, 'J');
  const ok = document.fonts.check(`${wt} 100px ${fam}`, 'J');
  const c = document.createElement('canvas'); c.width = c.height = R;
  const g = c.getContext('2d'), text = 'J';
  let fs = 100; g.font = `${wt} ${fs}px ${fam}`; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let m = g.measureText(text);
  let w = (m.actualBoundingBoxLeft + m.actualBoundingBoxRight) || m.width || 1, hh = (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) || fs * 0.72;
  fs = Math.max(1, 100 * Math.min(R * 0.84 / w, R * 0.84 / hh));
  g.font = `${wt} ${fs}px ${fam}`; m = g.measureText(text);
  w = (m.actualBoundingBoxLeft + m.actualBoundingBoxRight) || m.width || 1; hh = (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) || fs * 0.72;
  g.fillStyle = '#000'; g.fillText(text, (R - w) / 2 + (m.actualBoundingBoxLeft || 0), (R - hh) / 2 + (m.actualBoundingBoxAscent || fs * 0.72));
  /* ink share: how much of the square the J fills (room for stones) */
  const a = g.getImageData(0, 0, R, R).data; let ink = 0; for (let i = 3; i < a.length; i += 4) if (a[i] > 127) ink++;
  out[name] = { url: c.toDataURL('image/png'), loaded: ok, font: g.font, ink: +(ink / (R * R)).toFixed(3) };
}
window.MASKS = out;
</script></body></html>
