<style>
  /* six Tuesdays at once (46 · 2): the six evenings side by side; the coffeeshops, bars and homes light up.
     50: 46 · 2's columns exactly, as they were; Kahran, 27 Oct: "I don't want you to change the columns.
     I just wanted you to make it more readable within the columns. Like, just add some more paragraph
     breaks." So the grid, its gaps and its breakpoints are 46 · 2's, line for line (check.cjs measures
     both pages and holds them equal); inside each column the give is one sentence to a paragraph, with
     air between them, and a rule under the name. The hovers are 49's (a for all six, T-a). */
  .ask{font:500 clamp(1.3rem,2.4vw,1.9rem)/1.2 var(--sans);letter-spacing:-.02em;margin:0}
  .lead{font:15px var(--sans);margin:14px 0 0}
  .flip{display:flex;gap:6px;margin:14px 0 0}
  .flip button{font:14px var(--sans);border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:#fff;color:var(--ink);cursor:pointer}
  .flip button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  [hidden]{display:none!important}
  .six{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:16px;border-top:1.5px solid var(--ink);padding-top:12px}
  .col h3{font:600 14px/1.25 var(--sans);margin:0 0 10px;min-height:2.5em}
  .col ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .col li{font:13px/1.35 var(--mono);color:var(--mute);border:1px solid var(--box);padding:8px;min-height:3.4em}
  .col li.hit{color:var(--ink);border-color:var(--ink);background:var(--box)}
  /* inside a column, with EWC: one sentence to a paragraph, air between them (the columns don't move) */
  .col .with{border-top:1px solid var(--line);padding:10px 0 20px}
  .col .with p{margin:0;font:14px/1.5 var(--sans)}
  .col .with p + p{margin-top:12px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
  .hint{font:13px var(--sans);color:var(--mute);margin:14px 0 0;display:flex;align-items:center;gap:10px}
  .hint .all{font:13px var(--sans);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:#fff;color:var(--ink);cursor:pointer}
  .hint .all[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .col{position:relative;cursor:pointer;outline:none}
  .hov{display:none}
  .hov .opt{margin:0;font:14px/1.5 var(--sans)}
  /* T-a: a card over the column, under the name; --dx slides it back on screen (set by the script) */
  .col:is(:hover,:focus-visible,.is-open) .hov{display:block;position:absolute;z-index:5;left:-8px;top:var(--dy,30px);width:max(calc(100% + 16px),260px);max-width:calc(100vw - 32px);box-sizing:border-box;transform:translateX(var(--dx,0px));background:#fff;border:1px solid var(--ink);padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
  /* show all: every card open, in place (for phones) */
  body.show-all .col .hov{display:block!important;position:static!important;box-shadow:none!important;width:auto!important;max-width:none!important;transform:none!important;background:#fff;border:0;border-left:3px solid var(--ink);padding:10px 12px;margin:0 0 12px}
  @media (max-width:1000px){ .six{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:560px){ .six{grid-template-columns:1fr 1fr} }

  /* 83: why a Tuesday, four answers behind ?v=a|b|c|d, one shown; everything above this line is 50's */
  .why{display:none;padding:36px var(--x) 4px}
  body[data-v="a"] .why[data-opt="a"], body[data-v="b"] .why[data-opt="b"], body[data-v="c"] .why[data-opt="c"]{display:block}
  body[data-v="d"] .why[data-opt="d"]{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);column-gap:56px;align-items:end}
  .why-k{grid-column:1/-1;font:12px var(--mono);color:var(--mute);margin:0 0 14px;display:flex;gap:10px;align-items:center;text-transform:uppercase;letter-spacing:.08em}
  .why-k .ours{text-transform:none;letter-spacing:0;border:1px solid var(--line);border-radius:999px;padding:1px 9px}
  .why-line{font:500 clamp(1.15rem,2vw,1.6rem)/1.2 var(--sans);letter-spacing:-.02em;margin:0 0 18px;max-width:30ch}
  .why-q{margin:24px 0 0;padding-left:14px;border-left:3px solid var(--ink);max-width:48ch}
  .why-q p{margin:0;font:500 clamp(1.05rem,1.6vw,1.3rem)/1.35 var(--sans);letter-spacing:-.01em}
  .why-q footer{font:12px var(--mono);color:var(--mute);margin-top:8px}
  /* a: the week as a strip; six nights filled, Tuesday open */
  .week{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .night{position:relative;background:var(--ink);color:#fff;padding:12px 10px 14px;min-height:132px;display:flex;flex-direction:column;gap:6px}
  .night b{font:600 13px var(--mono)}
  .night span{font:14px/1.3 var(--sans)}
  .night .line-draft{color:var(--ink);align-self:flex-start;padding:0 3px}
  .night.open{background:#fff;color:var(--ink);outline:1.5px dashed var(--ink);outline-offset:-1.5px}
  .night .down{position:absolute;left:10px;bottom:8px;font:22px/1 var(--sans);background:none;padding:0}
  /* b: the week's curve; how spoken-for each night is, Tuesday on the floor */
  .curve{position:relative;padding-top:24px}
  .curve .axis{position:absolute;top:0;left:0;font:12px var(--mono);color:var(--mute)}
  .curve svg{position:absolute;left:0;top:24px;width:100%;height:170px;overflow:visible;z-index:1;pointer-events:none}
  .curve path{fill:none;stroke:var(--ink);stroke-width:2.5;vector-effect:non-scaling-stroke}
  .curve line{stroke:var(--line);stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
  .curve ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .curve li{position:relative;padding:182px 4px 10px;text-align:center;display:flex;flex-direction:column;gap:4px}
  .curve li.open{background:var(--box)}
  .curve .pt{z-index:2;position:absolute;left:50%;top:calc(var(--t) * 170px);width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ink)}
  .curve li.open .pt{width:16px;height:16px;margin:-8px 0 0 -8px;background:#fff;border:2.5px solid var(--ink);box-sizing:border-box}
  .curve li b{font:600 13px var(--mono)}
  .curve li span{font:13px/1.3 var(--sans);color:var(--mute);align-self:center}
  .curve li.open span{color:var(--ink);font-weight:600}
  /* c: the competition as places, each as wide as the wants it already holds; EWC the empty one */
  .why-sub{font:12px var(--mono);color:var(--mute);margin:0 0 8px}
  .street{display:flex;gap:6px;align-items:stretch}
  .place{flex:var(--n) 1 0;min-width:0;border:1.5px solid var(--ink);background:var(--box);padding:12px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
  .place b{font:600 14px/1.25 var(--sans)}
  .dots{display:flex;flex-wrap:wrap;gap:5px}
  .dots i{width:12px;height:12px;border-radius:50%;background:var(--ink)}
  .place.ewc{background:#fff;border-style:dashed}
  .place .why-q{margin:0;border-left-width:2px;padding-left:10px}
  .place .why-q p{font-size:clamp(.95rem,1.3vw,1.1rem)}
  /* d: a month; one Saturday event against the same mark on every Tuesday */
  .mh,.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .mh b{font:600 12px var(--mono);text-align:center;padding:0 0 6px;color:var(--mute)}
  .mh b.tue{color:var(--ink)}
  .cell{aspect-ratio:1;border:1px solid var(--box2);background:#fff;position:relative}
  .cell.tue{background:var(--ink);border-color:var(--ink)}
  .cell.event{border:1.5px solid var(--ink);background:var(--box)}
  .cell small{position:absolute;left:5px;right:5px;bottom:5px;font:11px/1.2 var(--mono)}
  .cell.tue small{color:#fff}
  @media (max-width:820px){ body[data-v="d"] .why[data-opt="d"]{grid-template-columns:1fr} }
  @media (max-width:560px){
    .week{grid-template-columns:1fr}
    .night{min-height:0;flex-direction:row;align-items:center;gap:14px;padding:11px 12px}
    .night b{width:3ch}
    .night.open{padding:22px 12px}
    .night .down{position:static;margin-left:auto}
    .curve li{padding-left:1px;padding-right:1px}
    .curve li span{font-size:10px}
    .street{flex-wrap:wrap}
    .place{flex:1 1 calc(50% - 3px);min-height:96px}
    .place.ewc{flex-basis:100%}
  }
</style>
{{WHY}}
<section class="body" aria-labelledby="bh">
  <div class="body-h"><h2 id="bh" class="ask">{{w:t.ask}}</h2></div>
  {{SIX}}
</section>
<script>
  // 83: which answer to why a Tuesday (?v=a|b|c|d, default a)
  { const v = new URLSearchParams(location.search).get('v'); document.body.dataset.v = /^[a-d]$/.test(v || '') ? v : 'a'; }
  // keep an open card on screen, 16px from either edge, and just under the member's name
  const fit = (c) => {
    const h = c.querySelector('.hov'), n = c.querySelector('h3');
    h.style.setProperty('--dy', Math.round(n.offsetTop + n.offsetHeight + 4) + 'px'); h.style.setProperty('--dx', '0px');
    const r = h.getBoundingClientRect(), vw = document.documentElement.clientWidth, g = 16;
    let dx = 0; if (r.right > vw - g) dx = vw - g - r.right; if (r.left + dx < g) dx = g - r.left;
    h.style.setProperty('--dx', Math.round(dx) + 'px');
  };
  const cols = [...document.querySelectorAll('.col')];
  cols.forEach(c => {
    ['mouseenter', 'focus'].forEach(ev => c.addEventListener(ev, () => fit(c)));
    c.addEventListener('click', (e) => { if (e.target.closest('button')) return; const was = c.classList.contains('is-open'); cols.forEach(x => x.classList.remove('is-open')); c.classList.toggle('is-open', !was); if (!was) fit(c); });
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('.col')) cols.forEach(x => x.classList.remove('is-open')); });
  addEventListener('resize', () => cols.filter(c => c.classList.contains('is-open')).forEach(fit));
  const all = document.querySelector('.hint .all');
  all.addEventListener('click', () => { const on = all.getAttribute('aria-pressed') !== 'true'; all.setAttribute('aria-pressed', on); document.body.classList.toggle('show-all', on); });
  const fs = [...document.querySelectorAll('.flip button')];
  fs.forEach(b => b.addEventListener('click', () => { const on = b.dataset.with === '1'; fs.forEach(x => x.setAttribute('aria-pressed', x === b)); document.querySelectorAll('.col').forEach(c => { c.querySelector('.without').hidden = on; c.querySelector('.with').hidden = !on; }); }));
</script>
