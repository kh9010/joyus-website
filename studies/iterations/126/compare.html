<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>126 / one at a time · Joyus homepage</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
<style>
/* one version at a time, full size, scrolled as it would be. Switching keeps the moment in the story; the beats jump to it. */
:root{--ink:#222;--soft:#666;--line:#e3e3e3}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13px/1.3 Montserrat,system-ui,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fafafa}
.bar .v,.bar .b{display:flex;gap:4px;flex-wrap:wrap}
.bar button{font:500 13px Montserrat,sans-serif;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar .v button{font-weight:600}
.bar .v button span{font-weight:400;opacity:.75;margin-left:5px}
.bar .keys{margin-left:auto;color:var(--soft)}
#frames{position:relative;flex:1;min-height:0}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden}
#frames iframe.show{visibility:visible}
@media(max-width:760px){.bar .keys{display:none}.bar .v button span{display:none}}
</style></head><body>
<div class="bar">
  <div class="v" role="group" aria-label="Version"></div>
  <div class="b" role="group" aria-label="Moment"></div>
  <span class="keys">1 2 3 4 version · ← → moment</span>
</div>
<div id="frames"></div>
<script>
const V = [['../125/c', 'before', '125 c'], ['step1', '1', 'seafoam'], ['step2', '2', 'one typeface'], ['case', '3', 'underlines']];
// the beats, as a share of each page's scroll story (the same points the pictures are taken at), then its ending
const BEATS = [['Question', .02], ['All of it', .19], ['Joiner', .29], ['Empty', .39], ['Newcomer', .52], ['Host', .6], ['Golfer', .69], ['Second act', .77], ['Regular', .86], ['All six', .97], ['Close', 'end']];
const frames = document.getElementById('frames'), vbar = document.querySelector('.bar .v'), bbar = document.querySelector('.bar .b');
const cells = V.map(([v, key, name], i) => {
  const f = document.createElement('iframe'); f.title = name; f.src = v + '.html'; frames.append(f);
  const b = document.createElement('button'); b.type = 'button'; b.innerHTML = `${key}<span>${name}</span>`; b.addEventListener('click', () => show(i)); vbar.append(b);
  return { f, b };
});
BEATS.forEach(([label, at], i) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.addEventListener('click', () => go(i)); bbar.append(b); });
let cur = 0, beat = 0;
const win = i => cells[i].f.contentWindow;
// where a frame is in its story: 0 to 1 over the scroll run, past 1 into the ending
const where = w => { const r = w.document.getElementById('run'); if (!r) return 0; const story = r.offsetHeight - w.innerHeight; return w.scrollY <= story ? w.scrollY / story : 1 + (w.scrollY - story) / Math.max(1, w.document.documentElement.scrollHeight - w.innerHeight - story); };
const put = (w, p) => { const r = w.document.getElementById('run'); if (!r) return; const story = r.offsetHeight - w.innerHeight, end = w.document.documentElement.scrollHeight - w.innerHeight; w.scrollTo(0, p <= 1 ? p * story : story + (p - 1) * (end - story)); };
function show(i) {
  const p = where(win(cur)); cur = i; put(win(i), p);
  cells.forEach((c, k) => { c.f.classList.toggle('show', k === i); c.b.setAttribute('aria-pressed', k === i); });
  cells[i].f.focus(); mark();
}
function go(i) { beat = Math.max(0, Math.min(BEATS.length - 1, i)); const at = BEATS[beat][1]; put(win(cur), at === 'end' ? 2 : at); mark(); }
// the beat button nearest to where the visible page is
function mark() { const p = where(win(cur)); let best = 0; BEATS.forEach(([, at], i) => { const x = at === 'end' ? 2 : at; if (Math.abs(x - p) < Math.abs((BEATS[best][1] === 'end' ? 2 : BEATS[best][1]) - p)) best = i; }); beat = best; [...bbar.children].forEach((b, i) => b.setAttribute('aria-pressed', i === best)); }
function keys(e) {
  if (e.key >= '1' && e.key <= String(V.length)) show(+e.key - 1);
  else if (e.key === 'ArrowRight') { go(beat + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { go(beat - 1); e.preventDefault(); }
}
addEventListener('keydown', keys);
cells.forEach(c => c.f.addEventListener('load', () => { const w = c.f.contentWindow; w.addEventListener('keydown', keys); w.addEventListener('scroll', () => { if (w === win(cur)) requestAnimationFrame(mark); }, { passive: true }); }));
show(0);
</script>
</body></html>
