<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>B / Two stones</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Rubik:wght@900&display=swap">
<style>
:root{--ink:#2C3544;--soft:#54606F;--line:#dfe2e6}
*{box-sizing:border-box}html,body{margin:0}body{font:17px/1.55 'Space Grotesk',system-ui,sans-serif;color:var(--ink);background:#fff}
.wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);min-height:100dvh}
.stage{position:sticky;top:0;height:100dvh;touch-action:pan-y}canvas{display:block;width:100%;height:100%}
.words{padding:clamp(28px,6vh,64px) clamp(20px,4vw,56px)}
h1{font:700 clamp(2rem,4vw,3.2rem)/1.02 'Space Grotesk';letter-spacing:-.03em;margin:0 0 10px}
#left{font-size:14px;color:var(--soft);margin:0 0 14px}
.picks{display:flex;gap:10px;margin:0 0 20px}
.picks button{font:inherit;color:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:0;border:2px solid var(--c);background:#fff;border-radius:16px;padding:9px 16px;min-height:60px;min-width:120px;cursor:pointer}
.picks b{font-weight:700}.picks small{font-size:12px;color:var(--soft)}.picks button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#log article{border-left:5px solid var(--c);padding:1px 0 1px 16px;margin:0 0 16px;animation:in .45s}
#log small{display:block;color:var(--soft);font-size:12px;letter-spacing:.06em;text-transform:uppercase}#log p{margin:2px 0 0}
@keyframes in{from{opacity:0;transform:translateX(-10px)}}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.stage{position:relative;height:46dvh}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
</head><body data-mode="carved"><div class="wrap">
<div class="stage" id="stage"><canvas id="gl" role="img" aria-label="Two big stones, one with a D cut through it, one with a K. Pick one to hear from that person next."></canvas></div>
<div class="words"><h1>Take a stone.</h1><p id="left"></p>
<div class="picks"><button id="pick-d" type="button" style="--c:#f25aa3"><b>D, Divya</b><small></small></button><button id="pick-k" type="button" style="--c:#2fc0d8"><b>K, Kahran</b><small></small></button></div>
<div id="log" aria-live="polite"></div></div></div>
<script type="module" src="two.js"></script></body></html>
