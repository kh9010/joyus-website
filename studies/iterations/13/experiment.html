<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Prototype — experiment page</title>
<link rel="stylesheet" href="wire.css">
<style>
  /* Study 05, B (the thing first), as a template: ?p=metro-museum */
  .head{padding:clamp(48px,8vh,96px) var(--x) 36px;display:grid;grid-template-columns:minmax(0,7fr) minmax(240px,3fr);gap:56px;align-items:end}
  .crumb{font:13px var(--mono);color:var(--mute);margin:0 0 22px;display:flex;gap:10px}
  .crumb a{border-bottom:1px solid var(--line)}
  .head h1{font:500 clamp(1.9rem,3.6vw,3.2rem)/1.15 var(--sans);letter-spacing:-.025em;margin:0 0 24px;max-width:22ch}
  .facts{margin:0;display:grid;gap:14px;font-size:14px}
  .facts div{border-top:1px solid var(--line);padding-top:8px}
  .facts dt{font:12px var(--mono);color:var(--mute);margin-bottom:2px}
  .facts dd{margin:0}
  .stage{margin:0 var(--x)}
  .screen{aspect-ratio:16/9;flex-direction:column;gap:14px;background:#2a2a28;color:#cfcfcb;border-color:#555}
  .screen span{background:none;color:#cfcfcb}
  .screen b{font:500 1.1rem var(--sans);border:1.5px solid #cfcfcb;border-radius:999px;padding:10px 22px}
  .screen.light{background:var(--box);color:var(--mute);border-color:var(--line)}
  .screen.light span{color:var(--mute)}
  .screen.light b{border-color:var(--ink);color:var(--ink)}
  .stage-bar{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .stage-bar a{border-bottom:1px solid var(--ink)}
  .phone-line{display:none;margin:12px 0 0}
  .log{padding:72px var(--x) 24px}
  .log-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:12px}
  .log-h h2{margin:0;font-size:1.35rem;font-weight:600}
  .log ol{list-style:none;margin:0;padding:0}
  .log li{display:grid;grid-template-columns:48px 120px 1fr auto;gap:20px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
  .log .no{font:14px var(--mono);color:var(--mute)}
  .log .thumb{width:120px;aspect-ratio:4/3;padding:2px}
  .none{border:1.5px dashed var(--line);padding:24px;margin-top:20px;max-width:640px}
  .next{display:flex;justify-content:space-between;align-items:center;gap:24px;margin:56px var(--x) 0;padding:28px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
  .next small{display:block;font:12px var(--mono);color:var(--mute);margin-bottom:6px}
  .next b{font:500 clamp(1.2rem,2.2vw,1.7rem)/1.2 var(--sans);letter-spacing:-.02em}
  .all{display:block;margin:18px var(--x) 0;font-size:14px}.all span{border-bottom:1px solid var(--ink)}
  .closing{padding:88px var(--x)}
  .closing p{font:500 clamp(1.6rem,3vw,2.6rem)/1.15 var(--sans);letter-spacing:-.03em;margin:0 0 18px;max-width:20ch}
  .closing a{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:10px 22px;font-weight:500}
  .missing{padding:96px var(--x)}.missing a{border-bottom:1px solid var(--ink)}
  @media (max-width:820px){ .head{grid-template-columns:1fr;gap:28px} .screen.playable{background:var(--box);color:var(--mute)} .screen.playable b{display:none} .playable-keys{display:none} .phone-line{display:block} .log li{grid-template-columns:32px 72px 1fr} .log li .mono{grid-column:3} .log .thumb{width:72px} }
</style>
</head>
<body>
<header class="nav"><a class="gbox" href="onepager.html">wordmark</a><ul><li><a href="onepager.html#work">work</a></li><li><a href="onepager.html#about">about</a></li><li><a href="onepager.html#say-hi">say hi</a></li></ul></header>
<main id="page"></main>
<footer class="foot"><div><a class="gbox" href="onepager.html">wordmark</a><p style="margin-top:12px">© 2026 · Joyus Studio · Kahran Singh &amp; Divya Tak</p></div><div>say hi<ul><li><a href="mailto:hello@joyus.studio">hello@joyus.studio</a></li></ul></div><div>find us<ul><li><a href="../../../podcast.html">podcast</a></li></ul></div></footer>
<script src="site-data.js"></script>
<script src="rounds.js"></script>
<script>
(function () {
  const slug = new URLSearchParams(location.search).get('p');
  const me = SITE.pieces.find(p => p.slug === slug && p.pill === 'exp');
  const page = document.getElementById('page');
  if (!me) { page.innerHTML = '<section class="missing"><h1>No such experiment.</h1><p><a href="onepager.html#work">See all ten</a></p></section>'; return; }
  document.title = 'Prototype — ' + me.client;
  const st = SITE.stage[slug] || { kind: 'unknown', note: '' };
  // the stage, by kind (Study 05's table). Only links that really exist are links.
  const REAL = { 'comics': ['read the comics', '../../../../comics/index.html'], 'line-before': ['divya.studiotypo.xyz ↗', 'https://divya.studiotypo.xyz'] };
  const label = { playable: '▶ click to walk in', video: '▶ play', reader: 'open the reader', installation: 'see the installation', stills: 'see the stills', unknown: '' }[st.kind];
  const out = REAL[slug] ? `<a href="${REAL[slug][1]}">${REAL[slug][0]}</a>` : `<span class="mono">[link: not found yet]</span>`;
  const rs = ROUNDS.filter(r => r.piece === me.client);
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], fmt = (d) => +d.slice(8) + ' ' + M[+d.slice(5, 7) - 1] + ' ' + d.slice(0, 4);
  const exps = SITE.pieces.filter(p => p.pill === 'exp'), nxt = exps[(exps.indexOf(me) + 1) % exps.length];
  const facts = SITE.facts[slug] || [['made by', '[who]'], ['since', '[when]']];
  page.innerHTML = `
  <section class="head"><div>
    <p class="crumb"><a href="onepager.html#work">Experiments</a><span>/</span><span>for ourselves</span></p>
    <h1>${esc(me.s)}</h1>
    <ul class="tags">${me.tags.map(t => `<li><span>${esc(t)}</span></li>`).join('')}</ul>
  </div><dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></section>
  <section class="stage"><div class="gbox screen ${st.kind === 'playable' || st.kind === 'video' ? st.kind : 'light'}"><span>${esc(st.kind)} · ${esc(st.note)}</span>${label ? `<b>${label}</b>` : ''}</div>
    ${st.kind === 'playable' ? '<p class="phone-line">Walk through it on a computer: it needs a keyboard.</p>' : ''}
    <div class="stage-bar"><span class="mono playable-keys">${esc(st.keys || '')}</span>${out}</div></section>
  <section class="log"><div class="log-h"><h2>How it got made</h2><span class="mono">oldest first · nothing replaced</span></div>
    ${rs.length ? '<ol>' + rs.map((r, i) => `<li><span class="no">${String(i + 1).padStart(2, '0')}</span><div class="gbox thumb"><span>img</span></div><b>${esc(r.title)}</b><span class="mono">${fmt(r.date)}</span></li>`).join('') + '</ol>' : '<div class="none"><b>No rounds yet.</b></div>'}
  </section>
  <a class="next" href="${pieceHref(nxt)}"><span><small>next in Experiments</small><b>${esc(nxt.s)}</b></span><span style="font-size:2rem">→</span></a>
  
  <section class="closing"><p>Something you want reimagined?</p><a href="onepager.html#say-hi">say hi</a></section>`;
})();
</script>
</body>
</html>
