<style>
  /* 3 · in the club's voice: the guide's rule for founder detail, then the Tuesday twice, theirs and the club's */
  .ask{font:500 clamp(1.3rem,2.4vw,1.9rem)/1.2 var(--sans);letter-spacing:-.02em;margin:0}
  .rule{font:13px var(--mono);color:var(--mute);margin:14px 0 0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:18px;border-top:1.5px solid var(--ink);padding-top:16px}
  .by{font:12px var(--mono);color:var(--mute);font-weight:400;margin:0 0 14px;display:flex;gap:10px;flex-wrap:wrap}
  .by small{font:inherit}
  .two ol{list-style:none;margin:0;padding:0;display:grid;gap:18px}
  .said li{font:400 1.05rem/1.4 var(--sans);color:var(--mute)}
  .said li::before,.lines li::before{content:"“"} .said li::after,.lines li::after{content:"”"}
  .lines li{font:500 clamp(1.15rem,2vw,1.5rem)/1.3 var(--sans);letter-spacing:-.015em}
  @media (max-width:760px){ .two{grid-template-columns:1fr} }
</style>
<section class="body" aria-labelledby="bh-3">
  <div class="body-h"><h2 id="bh-3" class="ask">{{w:t.ask}}</h2></div>
  {{VOICE}}
</section>
