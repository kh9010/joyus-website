<style>
  /* 6 · one member, deep: a tab each; who they are, their four wants and where they go, then what the club gives */
  .ask{font:500 clamp(1.3rem,2.4vw,1.9rem)/1.2 var(--sans);letter-spacing:-.02em;margin:0}
  .tabs{display:flex;flex-wrap:wrap;gap:0;margin:18px 0 0;border-bottom:1.5px solid var(--ink)}
  .tabs button{font:14px var(--sans);border:0;border-bottom:3px solid transparent;padding:10px 14px;background:none;color:var(--mute);cursor:pointer}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  [hidden]{display:none!important}
  .member{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);gap:40px;padding-top:22px}
  .member h3{font:500 clamp(1.4rem,2.6vw,2rem)/1.15 var(--sans);letter-spacing:-.02em;margin:0;grid-column:1}
  .profile{grid-column:1;margin:0;color:var(--mute);font-size:15px;max-width:34ch}
  .night{grid-column:2;grid-row:1 / span 3;list-style:none;margin:0;padding:0;counter-reset:n}
  .night li{display:grid;grid-template-columns:2em minmax(0,1fr);gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--box);counter-increment:n}
  .night li::before{content:counter(n);font:12px var(--mono);color:var(--mute);grid-row:span 2}
  .night b{font:500 1.1rem/1.3 var(--sans)}
  .where{font:13px var(--mono);color:var(--mute)}
  .give{grid-column:2;margin:0;font:500 1.1rem/1.4 var(--sans);max-width:46ch}
  .give b{display:block;font:12px var(--mono);color:var(--mute);margin-bottom:8px;font-weight:400}
  @media (max-width:760px){ .member{grid-template-columns:1fr;gap:16px} .member>*{grid-column:1!important;grid-row:auto!important} }
</style>
<section class="body" aria-labelledby="bh-6">
  <div class="body-h"><h2 id="bh-6" class="ask">{{w:t.ask}}</h2></div>
  {{DEEP}}
</section>
<script>
  const bs = [...document.querySelectorAll('.tabs button')], ms = [...document.querySelectorAll('.member')];
  bs.forEach(b => b.addEventListener('click', () => { bs.forEach(x => x.setAttribute('aria-selected', x === b)); ms.forEach(m => { m.hidden = m.dataset.p !== b.dataset.p; }); }));
</script>
