<style>
  /* 4 · their words first: the founders' answers, big, before anything of ours; then who */
  .ask{font:500 clamp(1.3rem,2.4vw,1.9rem)/1.2 var(--sans);letter-spacing:-.02em;margin:0}
  blockquote.said{margin:18px 0 0;padding:0;border-top:1.5px solid var(--ink)}
  .said p{font:500 clamp(1.2rem,2.3vw,1.8rem)/1.25 var(--sans);letter-spacing:-.02em;margin:0;padding:12px 0;border-bottom:1px solid var(--box)}
  .said p::before{content:"“"} .said p::after{content:"”"}
  .said footer{font:12px var(--mono);color:var(--mute);margin-top:10px}
  .heard{font:500 1.15rem/1.3 var(--sans);margin:26px 0 0}
  .then{font:12px var(--mono);color:var(--mute);font-weight:400;margin:22px 0 0}
  .pick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
  .pick button{font:14px var(--sans);border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:#fff;color:var(--ink);cursor:pointer}
  .pick button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  [hidden]{display:none!important}
  .night{list-style:none;margin:12px 0 0;padding:0}
  .night li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid var(--box);align-items:baseline}
  .night b{font-weight:500}
  .where{font:13px var(--mono);color:var(--mute)}
  @media (max-width:760px){ .night li{grid-template-columns:1fr} }
</style>
<section class="body" aria-labelledby="bh-4">
  <div class="body-h"><h2 id="bh-4" class="ask">{{w:t.ask}}</h2></div>
  {{WORDS}}
</section>
<script>
  const bs = [...document.querySelectorAll('.pick button')], ns = [...document.querySelectorAll('.night')];
  bs.forEach(b => b.addEventListener('click', () => { bs.forEach(x => x.setAttribute('aria-selected', x === b)); ns.forEach(n => { n.hidden = n.dataset.p !== b.dataset.p; }); }));
</script>
