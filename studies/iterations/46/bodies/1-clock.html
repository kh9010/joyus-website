<style>
  /* 1 · the clock: one member's day, morning to late; each want sits where it falls, beside where they go for it */
  .ask{font:500 clamp(1.3rem,2.4vw,1.9rem)/1.2 var(--sans);letter-spacing:-.02em;margin:0}
  .pick{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
  .pick button,.flip button{font:14px var(--sans);border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:#fff;color:var(--ink);cursor:pointer}
  .pick button[aria-selected="true"],.flip button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .flip{display:flex;gap:6px;margin:14px 0 0}
  .day{margin-top:16px;border-top:1.5px solid var(--ink)}
  [hidden]{display:none!important}
  .part{display:grid;grid-template-columns:7em minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--box)}
  .part h3{font:12px var(--mono);color:var(--mute);margin:4px 0 0;font-weight:400}
  .part.empty{opacity:.45}
  .part ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .part li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:baseline}
  .part b{font:500 1.1rem/1.3 var(--sans);letter-spacing:-.01em}
  .where{font:13px var(--mono);color:var(--mute)}
  .day.with .where{text-decoration:line-through}
  .give{display:none;font:500 clamp(1.1rem,1.9vw,1.4rem)/1.35 var(--sans);margin:0;padding:18px 0;max-width:46ch}
  .day.with .give{display:block}
  .give b{display:block;font:12px var(--mono);color:var(--mute);margin-bottom:8px;font-weight:400}
  .note{margin:22px 0 0;font-size:15px;max-width:60ch}
  .note b{font:12px var(--mono);color:var(--mute);font-weight:400;margin-right:6px}
  .note q{font-style:italic}
  .clock-draft{font:12px var(--mono);color:var(--mute)}
  @media (max-width:760px){ .part{grid-template-columns:1fr} .part li{grid-template-columns:1fr} }
</style>
<section class="body" aria-labelledby="bh-1">
  <div class="body-h"><h2 id="bh-1" class="ask">{{w:t.ask}}</h2><small class="clock-draft">{{w:k.draft}}</small></div>
  {{CLOCK}}
</section>
<script>
  const bs = [...document.querySelectorAll('.pick button')], ds = [...document.querySelectorAll('.day')], fs = [...document.querySelectorAll('.flip button')];
  bs.forEach(b => b.addEventListener('click', () => { bs.forEach(x => x.setAttribute('aria-selected', x === b)); ds.forEach(n => { n.hidden = n.dataset.p !== b.dataset.p; }); }));
  fs.forEach(b => b.addEventListener('click', () => { fs.forEach(x => x.setAttribute('aria-pressed', x === b)); ds.forEach(n => n.classList.toggle('with', b.dataset.with === '1')); }));
</script>
